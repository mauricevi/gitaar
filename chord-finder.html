<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Finder</title>
<!-- CHORD FINDER (Practice Room): alle voicings van een akkoord over de hele hals. Drop 2, drop 3, drop 2&4, close, rootless,
     shells, triads, barré; filteren op snarenset, laagste noot (omkering), topnoot en fretbereik.
     Modus "What's this chord?" (vorm → naam) en "Progression" (akkoorden → voicings met voice leading, baslijn, band).
     Code in chordfinder/ (gewone scripts, één gedeelde scope, volgorde telt). Opslag: 'chordFinder.v1' en 'chordFinder.log'. -->
<link rel="stylesheet" href="chordfinder/style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">Practice Room</div>
    <nav>
      <a id="lnkHome" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="fretboard-trainer.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14M15 5v14M3 12h18"/></svg><span>Fretboard Trainer</span></a>
      <a href="toonladder-trainer.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/></svg><span>Scale Trainer</span></a>
      <a href="note-prompter.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 15V8l6-1v7"/><circle cx="8" cy="15" r="1.6"/><circle cx="14" cy="14" r="1.6"/></svg><span>Note Prompter</span></a>
      <a href="chord-moves.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 8h14M10 3v18M14 3v18"/><circle cx="10" cy="12" r="1.4" fill="currentColor"/><circle cx="14" cy="15" r="1.4" fill="currentColor"/></svg><span>Chord Moves</span></a>
      <a class="cur" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><circle cx="8.5" cy="9" r="1.2" fill="currentColor"/><circle cx="12.5" cy="12" r="1.2" fill="currentColor"/></svg><span>Chord Finder</span></a>
      <a href="lick-lab.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 16c2.5 0 2.5-8 5-8s2.5 8 5 8 2.5-8 5-8 2.5 4 3 4"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="13" cy="16" r="1.3" fill="currentColor"/></svg><span>Lick Lab</span></a>
      <a href="tuner.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 21h14"/><path d="M12 17V4"/><path d="M8 7l4-3 4 3"/><path d="M6 13h2M16 13h2M7 9.5h1.5M15.5 9.5H17"/></svg><span>Tuner</span></a>
    </nav>
  </aside>

  <main>
    <header class="tb">
      <div><h1 id="h1">Chord Finder</h1><p class="sub" id="sub"></p></div>
      <div class="tr"><span class="seg" id="segMode" role="group" aria-label="Mode"></span>
        <label class="krow dgsz" id="dgSizeL"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M5 8h14M10 3v18M14 3v18"/></svg><input type="range" id="dgSize" min="80" max="200" step="10"></label>
        <button type="button" class="ib" id="btnTheme"></button></div>
    </header>

    <div id="vFind" class="view">

    <!-- akkoord: intypen of kiezen -->
    <section class="card filters" aria-label="Chord">
      <div class="cin">
        <label for="inChord" class="lb">Chord</label>
        <input id="inChord" type="text" autocomplete="off" spellcheck="false" autocapitalize="off">
        <p class="err" id="chordErr" role="status"></p>
      </div>
      <div class="frow"><span class="lb">Root</span><span class="seg" id="segRoot" role="group" aria-label="Root"></span></div>
      <div id="qualRows" class="filters"></div>
    </section>

    <!-- soort voicing en filters -->
    <section class="card filters" aria-label="Voicing">
      <div class="frow"><span class="lb">Voicing</span><span class="seg" id="segType" role="group" aria-label="Voicing"></span></div>
      <p class="note" id="typeHelp"></p>
      <div class="frow"><span class="lb">Strings</span><div class="chips" id="chStr" role="group" aria-label="Strings"></div></div>
      <div class="frow"><span class="lb">Lowest note</span><div class="chips" id="chLow" role="group" aria-label="Lowest note"></div></div>
      <div class="frow"><span class="lb">Top note</span><div class="chips" id="chTop" role="group" aria-label="Top note"></div></div>
      <div class="frow">
        <span class="lb">Frets</span>
        <span class="krow"><select id="selFrom" aria-label="From fret"></select><span class="cap">to</span><select id="selTo" aria-label="To fret"></select></span>
      </div>
      <div class="frow"><span class="lb">Labels</span><span class="seg" id="segLab" role="group" aria-label="Labels"></span></div>
    </section>

    <!-- de gekozen vorm -->
    <section class="card detail" id="detail" aria-label="Selected shape">
      <div class="dtop">
        <button type="button" class="big" id="dBig" aria-label="Play this shape"></button>
        <div class="dside">
          <div class="dhead"><h2 id="dTitle"></h2>
            <div class="tr"><button type="button" class="ib" id="btnPrev"></button><button type="button" class="ib" id="btnNext"></button></div></div>
          <div id="dInfo"></div>
          <div class="tp">
            <button type="button" class="act pri" id="btnPlay"></button>
            <button type="button" class="act" id="btnArp"></button>
          </div>
          <div class="tgs">
            <label class="tgl"><span class="tg"><input type="checkbox" role="switch" id="tgBass"><i></i></span>Bass</label>
            <label class="tgl"><span class="tg"><input type="checkbox" role="switch" id="tgTones"><i></i></span>All chord tones on the neck</label>
          </div>
        </div>
      </div>
      <div class="nk" id="dNeck"></div>
    </section>

    <!-- alle vormen -->
    <section class="card" aria-label="Shapes">
      <div class="rhead">
        <h3 id="resCount" style="margin:0"></h3>
        <button type="button" class="lnk" id="btnShowAll" style="margin:0">Show all</button>
        <span class="frow" style="margin-left:auto"><span class="cap">Group by</span><span class="seg" id="segGroup" role="group" aria-label="Group by"></span></span>
      </div>
      <div id="groups"></div>
    </section>
    <p class="note" id="keysHint"></p>
    </div>

    <!-- What's this chord?: noten op de hals → namen -->
    <div id="vId" class="view" hidden>
      <section class="card" aria-label="Shape">
        <div class="dhead"><h2 id="idTitle"></h2>
          <div class="tr"><button type="button" class="act pri" id="idPlay"></button><button type="button" class="act" id="idArp"></button><button type="button" class="act" id="idClear"></button></div></div>
        <p class="note" id="idHow" style="margin-top:6px"></p>
        <div class="nk inp" id="idNeck"></div>
      </section>
      <section class="card idres" aria-label="Possible names">
        <div id="idShape" class="idshape"><div class="idg" id="idDg"></div><div><p class="cap">Frets <span class="mono" id="idFrets"></span></p><div class="nts" id="idNotes" style="margin-top:8px"></div></div></div>
        <div><h3 id="idNamesH"></h3><ol class="idl" id="idList"></ol></div>
      </section>
    </div>

    <!-- Progression: akkoorden → één vorm per akkoord met voice leading -->
    <div id="vProg" class="view" hidden>
     <div class="pglay">
      <div class="pgmain">
      <section class="card filters" aria-label="Progression">
        <div class="cin pgin">
          <label for="pgIn" class="lb" id="pgInL"></label>
          <textarea id="pgIn" rows="2" autocomplete="off" spellcheck="false" autocapitalize="off"></textarea>
          <select id="pgSt" hidden></select>
          <p class="note" id="pgInHelp"></p>
          <p class="err" id="pgErr" role="status"></p>
          <p class="note" id="pgApprox"></p>
        </div>
        <div class="frow"><span class="lb" id="pgTypeL"></span><span class="seg" id="pgType" role="group" aria-label="Voicing"></span></div>
        <div class="frow"><span class="lb" id="pgModeL"></span><span class="seg" id="pgMode" role="group" aria-label="Voice leading"></span></div>
        <p class="note" id="pgModeHelp"></p>
        <div class="frow" id="pgPosRow"><span class="lb" id="pgPosL"></span><select id="pgPos" aria-label="Position"></select></div>
        <div class="frow" id="pgStrRow"><span class="lb" id="pgStrL"></span><div class="chips" id="pgStr" role="group" aria-label="String set"></div></div>
        <div class="cin" id="pgMelRow">
          <label for="pgMel" class="lb" id="pgMelL"></label>
          <input id="pgMel" type="text" autocomplete="off" spellcheck="false" autocapitalize="off">
          <p class="err" id="pgMelErr" role="status"></p>
        </div>
        <div class="frow"><span class="lb" id="pgLineL"></span><span class="seg" id="pgLine" role="group" aria-label="Bass line"></span></div>
        <p class="note" id="pgLineHelp"></p>
        <div class="frow"><span class="lb" id="pgLabL"></span><span class="seg" id="pgLab" role="group" aria-label="Labels"></span></div>
      </section>

      <section class="card" aria-label="Voicings">
        <div class="tp pgtp">
          <button type="button" class="act pri" id="pgPlay"></button>
          <label class="krow cap" for="pgTempo"><span id="pgTempoL"></span><input type="range" id="pgTempo" min="40" max="260" step="2"><b class="mono" id="pgBpm"></b></label>
          <label class="tgl"><span class="tg"><input type="checkbox" role="switch" id="pgLoop"><i></i></span><span id="pgLoopL"></span></label>
          <label class="tgl"><span class="tg"><input type="checkbox" role="switch" id="pgBass"><i></i></span><span id="pgBassL"></span></label>
        </div>
        <!-- band: stijl, drums, volume per instrument, baslijn op de hals -->
        <div class="tp pgband">
          <span class="krow"><span class="cap" id="pgStyleL"></span><span class="seg" id="pgStyle" role="group" aria-label="Style"></span></span>
          <label class="tgl"><span class="tg"><input type="checkbox" role="switch" id="pgDrums"><i></i></span><span id="pgDrumsL"></span></label>
          <span class="pgmix" id="pgMix"></span>
          <label class="tgl"><span class="tg"><input type="checkbox" role="switch" id="pgBNeck"><i></i></span><span id="pgBNeckL"></span></label>
        </div>
        <p class="cap" id="pgSum" style="margin-top:12px"></p>
        <!-- selectie en vastleggen voor de hele rij -->
        <div class="pgbar"><button type="button" class="lnk" id="pgSelAll"></button><span class="cap" id="pgSelHelp"></span>
          <button type="button" class="lnk" id="pgRefitAll"></button><button type="button" class="lnk" id="pgUnlock"></button></div>
        <div id="pgRows"></div>
        <p class="note" id="pgLegend" style="margin-top:10px"></p>
      </section>
      </div>

      <!-- zijpaneel: gekozen akkoord(en), acties, eigen voicingsoort, vormen -->
      <aside class="pgside" aria-label="Selected chord">
        <section class="card" id="pgSide">
          <h3 id="pgSelH" style="margin:0"></h3>
          <p class="cap" id="pgSelSub"></p>
          <p class="note pgst" id="pgState"></p>
          <div class="pgacts"><button type="button" class="act" id="pgSPlay"></button><button type="button" class="act" id="pgSLock"></button><button type="button" class="act" id="pgSRefit"></button></div>
          <div class="pgsrow"><span class="cap" id="pgSTypeL"></span><span class="seg" id="pgSType" role="group" aria-label="Voicing for the selection"></span></div>
          <h3 id="pgAltH" class="pgalth"></h3>
          <div class="pgsrow" id="pgFitRow"><span class="cap" id="pgFitL"></span><span class="seg" id="pgFit" role="group" aria-label="When I pick a shape"></span></div>
          <p class="note" id="pgFitHelp"></p>
          <div class="dgs" id="pgAlts"></div>
        </section>
        <section class="card" id="pgBassBox" aria-label="Bass line" hidden>
          <h3 id="pgBassH"></h3>
          <p class="note" id="pgBassHelp"></p>
          <div class="nk" id="pgBassNeck"></div>
        </section>
      </aside>
     </div>
      <p class="note" id="pgKeys"></p>
    </div>

    <section class="card">
      <h3>How it works</h3>
      <p class="note" id="howTxt"></p>
      <h3 style="margin-top:18px">Backup (all Practice Room apps)</h3>
      <div id="prBackup" data-app="Chord Finder" data-btn="act"></div>
    </section>
  </main>
</div>
<!-- volgorde telt: alle scripts delen één scope -->
<script src="backing-sounds.js"></script>  <!-- piano-, bas- en drumopnames (mag ontbreken) -->
<script src="chordfinder/backup.js"></script>
<script src="chordfinder/text.js"></script>
<script src="chordfinder/theory.js"></script>
<script src="chordfinder/voicings.js"></script>
<script src="chordfinder/sound.js"></script>
<script src="chordfinder/render.js"></script>
<script src="chordfinder/ui.js"></script>
<script src="chordfinder/identify.js"></script>
<script src="chordfinder/bass.js"></script>
<script src="chordfinder/progression.js"></script>
<script src="chordfinder/main.js"></script>
</body>
</html>
