<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Finder</title>
<link rel="icon" type="image/svg+xml" href="shared/favicon.svg">
<!-- CHORD FINDER (Practice Room): alle voicings van een akkoord over de hele hals. Drop 2, drop 3, drop 2&4, close, rootless,
     shells, triads, barré; filteren op snarenset, laagste noot (omkering), topnoot en fretbereik.
     Modus "What's this chord?" (vorm → naam) en "Progression" (akkoorden → voicings met voice leading, baslijn, band).
     Schil (icoonbalk, achtergrond, kolom rechts, transportplank): shared/room.css + shared/rail.js; toets S = geheim menu (shared/look.js).
     Code in chordfinder/ (gewone scripts, één gedeelde scope, volgorde telt). Opslag: 'chordFinder.v1' en 'chordFinder.log'. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=DotGothic16&family=Pixelify+Sans:wght@400..700&family=VT323&family=Space+Mono:wght@400;700&family=Handjet:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/room.css">
<link rel="stylesheet" href="chordfinder/style.css">
</head>
<body>
<div class="bgfx photo"></div><div class="bgfx tex"></div><div class="bgfx grain"></div>
<div class="shell">
  <!-- icoonbalk: alleen apps (shared/rail.js tekent hem) -->
  <nav class="rail" id="side" data-app="chord-finder"></nav>

  <main class="main">
    <div class="scroll" id="scroll">
     <div class="wrap">
      <header class="top">
        <h1 class="px" id="h1">Chord Finder</h1>
        <span class="seg glass" id="segMode" role="group" aria-label="Mode"></span>
        <span class="help dn r wide" tabindex="0" aria-label="How it works">?<i id="howTxt"></i></span>
        <div class="grow"></div>
      </header>

      <!-- Find voicings: past op één scherm. Akkoord + soort bovenaan, daaronder de uitklapbare strook "Strings & filters"
           (zelfde onderdeel als in Progression); de vormen vullen de rest (fitShapes in render.js); de gekozen vorm staat op de transportplank onderaan (#fdTray) -->
      <div id="vFind" class="view">
      <section class="paper panel filters" aria-label="Chord and voicing">
        <div class="cin">
          <label for="inChord" class="vh">Chord</label>
          <input id="inChord" type="text" autocomplete="off" spellcheck="false" autocapitalize="off">
          <div class="qpop"><button type="button" class="act" id="btnQual" aria-expanded="false" aria-controls="qualPop"></button>
            <div class="paper qpanel" id="qualPop" role="dialog" aria-label="Chord type" hidden><div id="qualRows" class="filters"></div></div></div>
          <span class="seg" id="segRoot" role="group" aria-label="Root"></span>
          <p class="err" id="chordErr" role="status"></p>
        </div>
        <div class="frow"><span class="lb px">Voicing</span><span class="seg" id="segType" role="group" aria-label="Voicing"></span><span class="help" tabindex="0" aria-label="About this voicing type">?<i id="typeHelp"></i></span>
          <button type="button" class="fbtn" data-fs="find" aria-expanded="false" aria-controls="fsFind"></button></div>
        <div class="fstrip" id="fsFind" hidden></div>
      </section>

      <!-- alle vormen: zo groot als past; groepen kiezen met de tabjes of de kopjes (Shift = meer); past het niet, dan één groep tegelijk -->
      <section class="paper panel results" aria-label="Shapes">
        <div class="rhead">
          <h3 id="resCount" class="px"></h3>
          <button type="button" class="lnk" id="btnShowAll">Show all</button>
          <span class="seg gtabs" id="gTabs" role="group" aria-label="Groups" hidden></span>
          <span class="help" tabindex="0" aria-label="Keys">?<i id="keysHint"></i></span>
          <span class="frow" id="groupRow" style="margin-left:auto"><span class="cap">Group by</span><span class="seg" id="segGroup" role="group" aria-label="Group by"></span></span>
        </div>
        <div id="groups"></div>
      </section>
      </div>

      <!-- What's this chord?: noten op de hals → namen -->
      <div id="vId" class="view" hidden>
        <section class="paper panel" aria-label="Shape">
          <div class="dhead"><h2 id="idTitle" class="px"></h2>
            <div class="tr"><button type="button" class="act pri" id="idPlay"></button><button type="button" class="act" id="idArp"></button><button type="button" class="act" id="idClear"></button></div></div>
          <p class="note" id="idHow" style="margin-top:6px"></p>
          <div class="nk inp" id="idNeck"></div>
        </section>
        <section class="paper panel idres" aria-label="Possible names">
          <div id="idShape" class="idshape"><div class="idg" id="idDg"></div><div><p class="cap">Frets <span class="mono" id="idFrets"></span></p><div class="nts" id="idNotes" style="margin-top:8px"></div></div></div>
          <div><h3 id="idNamesH" class="px"></h3><ol class="idl" id="idList"></ol></div>
        </section>
      </div>

      <!-- Progression: akkoorden → één vorm per akkoord met voice leading -->
      <div id="vProg" class="view" hidden>
        <section class="paper panel input" aria-label="Progression">
          <div class="chords">
            <label for="pgIn" class="vh" id="pgInL"></label>
            <textarea id="pgIn" rows="1" autocomplete="off" spellcheck="false" autocapitalize="off"></textarea>
            <div class="from"><select id="pgSt" hidden></select><span class="help dn l" tabindex="0" aria-label="How to type chords">?<i id="pgInHelp"></i></span></div>
          </div>
          <p class="err" id="pgErr" role="status"></p>
          <p class="note" id="pgApprox"></p>
          <!-- voicingsoort en voice leading op één regel, daaronder de strook "Strings & filters" -->
          <div class="opts">
            <div class="opt"><span class="lb px" id="pgTypeL"></span><span class="seg" id="pgType" role="group" aria-label="Voicing"></span></div>
            <div class="opt"><span class="lb px" id="pgModeL"></span><span class="seg" id="pgMode" role="group" aria-label="Voice leading"></span><span class="help" tabindex="0" aria-label="About this voice leading">?<i id="pgModeHelp"></i></span></div>
            <div class="opt" id="pgPosRow"><span class="lb px" id="pgPosL"></span><select id="pgPos" aria-label="Position"></select></div>
            <div class="opt" id="pgMelRow"><label for="pgMel" class="lb px" id="pgMelL"></label><input id="pgMel" type="text" autocomplete="off" spellcheck="false" autocapitalize="off"><p class="err" id="pgMelErr" role="status"></p></div>
            <button type="button" class="fbtn" data-fs="prog" aria-expanded="false" aria-controls="fsProg"></button>
          </div>
          <div class="fstrip" id="fsProg" hidden></div>
        </section>

        <div class="lines" id="pgRows"></div>
      </div>
     </div>
    </div>

    <!-- transportplank (Find voicings): de gekozen vorm. Naam en noten, bladeren, spelen, en waar hij op de hele hals ligt (klik = spelen) -->
    <footer class="tray glass fdtray" id="fdTray" hidden>
      <span class="fdnav"><button type="button" class="ib" id="btnPrev"></button><button type="button" class="ib" id="btnNext"></button></span>
      <div class="fdi"><h2 id="dTitle" class="sym"></h2><div id="dInfo"></div></div>
      <button type="button" class="play" id="btnPlay"></button>
      <button type="button" class="ib" id="btnArp"></button>
      <label class="tg"><input type="checkbox" role="switch" id="tgBass"><i></i>Bass</label>
      <button type="button" class="fdneck" id="dBig" aria-label="Play this shape"></button>
    </footer>

    <!-- transportplank (Progression): wat je met de gitaar op schoot nodig hebt -->
    <footer class="tray glass" id="pgTray" hidden>
      <button type="button" class="play" id="pgPlay"></button>
      <label class="tempo" for="pgTempo"><span id="pgTempoL"></span><input type="range" id="pgTempo" min="40" max="260" step="2"><b class="bpm" id="pgBpm"></b></label>
      <label class="tg"><input type="checkbox" role="switch" id="pgLoop"><i></i><span id="pgLoopL"></span></label>
      <label class="tg"><input type="checkbox" role="switch" id="pgBass"><i></i><span id="pgBassL"></span></label>
      <!-- meer akkoorden geselecteerd (Ctrl/Shift-klik): acties voor de hele selectie -->
      <span class="selbar" id="pgSelBar" hidden><b id="pgSelN"></b><button type="button" class="act sm" id="pgSLock"></button><button type="button" class="act sm" id="pgSRefit"></button>
        <select id="pgSType" aria-label="Voicing for the selection"></select></span>
      <span class="stat" id="pgSum"></span>
      <!-- uitleg van de stippelring op de kaarten -->
      <span class="pgkey"><svg viewBox="0 0 22 22" aria-hidden="true"><rect class="wd" width="22" height="22" rx="5"/><circle class="dt i3 hd" cx="11" cy="11" r="7"/></svg><span id="pgHeldL"></span><span class="help l" tabindex="0" aria-label="What the rings mean">?<i id="pgHeldHelp"></i></span></span>
      <span class="help l" tabindex="0" aria-label="Keys">?<i id="pgKeys"></i></span>
    </footer>
  </main>

  <!-- kolom rechts: instellen, niet spelen (alleen Settings, in alle modi) -->
  <aside class="col" id="col" aria-label="Side panel">
    <button type="button" class="ib reopen" data-col="open" title="Show side panel" aria-label="Show side panel"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="colhd">
      <h2 class="px" id="colH">Settings</h2>
      <button type="button" class="ib" data-col="shut" title="Hide side panel" aria-label="Hide side panel"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div id="tabSet">
      <div id="setBand">
        <h3>Band</h3>
        <div class="row"><span id="pgStyleL"></span><span class="seg" id="pgStyle" role="group" aria-label="Style"></span></div>
        <div class="row"><span id="pgDrumsL"></span><label class="tg"><input type="checkbox" role="switch" id="pgDrums" aria-label="Drums"><i></i></label></div>
        <div id="pgMix"></div>
      </div>

      <h3>Display</h3>
      <div class="row" id="labRow"><span>Labels</span><span class="seg" id="segLab" role="group" aria-label="Labels"></span></div>
      <div class="row" id="dgSizeL"><span>Diagram size</span><input type="range" id="dgSize" min="80" max="200" step="10"></div>
      <div class="row" id="tonesRow"><span>All chord tones on the neck</span><label class="tg"><input type="checkbox" role="switch" id="tgTones" aria-label="All chord tones on the neck"><i></i></label></div>
      <div id="setDisp">
        <div class="row"><span>Card details <span class="help r" tabindex="0" aria-label="What the cards show">?<i id="pgLegend"></i></span></span><span class="seg" id="segDet" role="group" aria-label="Card details"></span></div>
      </div>

      <div id="setEdit">
        <h3>Editing</h3>
        <div class="row" id="pgFitRow"><span><span id="pgFitL"></span> <span class="help r" tabindex="0" aria-label="About picking a shape">?<i id="pgFitHelp"></i></span></span><span class="seg" id="pgFit" role="group" aria-label="When I pick a shape"></span></div>
        <div class="row"><span id="pgKept"></span><button type="button" class="act sm" id="pgRefitAll"></button></div>
        <div class="row"><span id="pgLocked"></span><button type="button" class="act sm" id="pgUnlock"></button></div>
        <div class="row"><span><span id="pgSelLbl">Selection</span> <span class="help r" tabindex="0" aria-label="Selecting chords">?<i id="pgSelHelp"></i></span></span><button type="button" class="act sm" id="pgSelAll"></button></div>
      </div>

      <h3>Backup</h3>
      <p class="note" style="margin-bottom:10px">All Practice Room apps.</p>
      <div id="prBackup" data-app="Chord Finder" data-btn="act sm"></div>
    </div>
  </aside>
</div>

<!-- Progression: vorm kiezen voor één akkoord. Venster in het midden, de rest dimt; Esc of een klik ernaast sluit (progression.js: pgOpen) -->
<div class="scrim" id="pgModal" hidden>
  <section class="paper pgm" role="dialog" aria-modal="true" aria-labelledby="pgMH" tabindex="-1">
    <div class="pgmh">
      <button type="button" class="ib" id="pgMPrev"></button>
      <h2 id="pgMH"></h2>
      <button type="button" class="ib" id="pgMNext"></button>
      <p class="cap" id="pgMSub"></p>
      <div class="pgacts"><button type="button" class="act" id="pgMPlay"></button><button type="button" class="act" id="pgMLock"></button><button type="button" class="act" id="pgMRefit"></button><button type="button" class="act" id="pgMRel" hidden></button></div>
      <span class="help l" tabindex="0" aria-label="How to choose">?<i id="pgMHelp"></i></span>
      <button type="button" class="ib" id="pgMX"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="pgmo">
      <span class="lb px" id="pgMTypeL"></span><span class="seg" id="pgMType" role="group" aria-label="Voicing for this chord"></span>
      <span class="lb px" id="pgMStrL"></span><span class="seg" id="pgMStr" role="tablist" aria-label="String set"></span>
      <p class="note pgst" id="pgMState"></p>
    </div>
    <div class="pgmb" id="pgMBody"></div>
  </section>
</div>
<!-- volgorde telt: alle scripts delen één scope -->
<script src="shared/look.js"></script>           <!-- geheim menu S (Look), vóór rail.js -->
<script src="shared/rail.js"></script>           <!-- icoonbalk, achtergrond, korrel -->
<script src="backing-sounds.js" defer></script>  <!-- piano-, bas- en drumopnames (mag ontbreken) -->
<script src="shared/backup.js"></script>         <!-- back-up (PRB), vóór de app -->
<script src="chordfinder/text.js"></script>
<script src="chordfinder/theory.js"></script>
<script src="chordfinder/voicings.js"></script>
<script src="shared/guitar.js"></script>          <!-- zachte jazzgitaar voor de akkoorden (GTR) -->
<script src="chordfinder/sound.js"></script>
<script src="chordfinder/render.js"></script>
<script src="chordfinder/ui.js"></script>
<script src="chordfinder/identify.js"></script>
<script src="chordfinder/bass.js"></script>
<script src="chordfinder/progression.js"></script>
<script src="chordfinder/main.js"></script>
</body>
</html>
