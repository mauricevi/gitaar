<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════════════
   HOME · Practice Room
   Teksten en trainers pas je aan in het blok "JOUW INSTELLINGEN" onderaan (in het <script>).
   De lampjes op het bord tonen wat je aan het leren bent:
   · Your progression  → de laatst geopende progressie uit de Scale Trainer, akkoord na akkoord
   · Notes due today   → de noten die de Fretboard Trainer vandaag wil herhalen
   Beide lezen de opgeslagen gegevens van de trainers in deze browser (alleen lezen).
   ════════════════════════════════════════════════════════════════════════════ */
:root{--bg:#07070c;--tx:#f5efe6;--mut:#b8b0a3;--mut2:#7d766b;--glow:#ffb547;--teal:#4fe3d0;--violet:#b98cff;--rose:#ff8fab;
  --wd1:#3e2518;--wfret:rgba(205,198,186,.32);--wnut:#d9d3c7;--wstr:#d6cfc1;--winl:rgba(232,225,210,.32);
  --fr:.9fr .944fr .891fr .841fr .794fr .749fr .707fr .667fr .63fr .595fr .561fr .53fr .5fr .472fr .446fr .42fr;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Bricolage Grotesque",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--tx)}a:hover{color:var(--glow)}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--glow);outline-offset:3px;border-radius:8px}
.m{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.page{min-height:100vh;background:radial-gradient(60% 42% at 50% 50%,rgba(255,181,71,.13),rgba(7,7,12,0) 70%),var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px 56px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:26px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.live{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
nav{display:flex;flex-wrap:wrap;gap:24px;font-size:15px}
nav a{color:var(--mut);text-decoration:none}nav a:hover{color:var(--tx)}
.hero{text-align:center;padding:48px 0 4px}
.kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--glow)}
h1{font-size:clamp(46px,7vw,100px);line-height:.97;font-weight:800;letter-spacing:-.035em;margin:18px auto 18px;max-width:13ch}
.sub{font-size:19px;line-height:1.5;color:var(--mut);max-width:42ch;margin:0 auto;min-height:3em}   /* vaste hoogte: het bord springt niet bij wisselen */
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
.seg button{min-height:38px;padding:0 18px;border:0;border-radius:999px;background:none;color:var(--mut);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
.ctr{display:flex;justify-content:center;margin:30px 0 4px}
/* ── bord ── */
.stage{perspective:1500px;padding:30px 0 0}
.tilt{transform:rotateX(24deg);transform-origin:50% 85%}
.bwrap{overflow-x:auto;padding:4px 2px 30px}
.neck{position:relative;min-width:860px;filter:drop-shadow(0 34px 60px rgba(0,0,0,.75))}
.row{position:relative;display:grid;grid-template-columns:var(--fr);height:48px}
.c{position:relative;background:var(--wd1);border-right:4px solid var(--wfret)}
.c.o{background:transparent;border-right:7px solid var(--wnut)}
.row:first-child .c:last-child{border-top-right-radius:10px}.row:last-child .c:last-child{border-bottom-right-radius:10px}
.c::before{content:"";position:absolute;left:0;right:-4px;top:50%;height:var(--t);transform:translateY(-50%);background:var(--wstr);opacity:.85;z-index:2}
.c.o::before{right:0;opacity:.25}
.inl{position:absolute;inset:0;display:grid;grid-template-columns:var(--fr);pointer-events:none;z-index:1}
.inl span{position:relative}
.inl b{position:absolute;left:50%;width:11px;height:11px;border-radius:50%;background:var(--winl);transform:translate(-50%,-50%)}
.inl b.m{top:50%}.inl b.u{top:33.33%}.inl b.d{top:66.67%}
.ghost{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(245,239,230,.18);z-index:3}
.lt{position:absolute;left:50%;top:50%;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%) scale(.55);opacity:0;display:grid;place-items:center;
  font:600 11px/1 "JetBrains Mono",ui-monospace,monospace;color:#1a1006;background:var(--glow);z-index:4;transition:opacity .45s ease,transform .45s ease,box-shadow .45s ease}
.lt.r{background:#f5efe6;box-shadow:0 0 0 2px #f5efe6}
.lt.on{opacity:1;transform:translate(-50%,-50%) scale(1);box-shadow:0 0 18px 5px rgba(255,181,71,.55)}
.lt.r.on{box-shadow:0 0 0 2px #f5efe6,0 0 22px 6px rgba(245,239,230,.45)}
.lt.n{background:var(--teal)}
.lt.n.on{box-shadow:0 0 18px 5px rgba(79,227,208,.5);animation:breathe 3.2s ease-in-out infinite,ripple 6s ease-in-out infinite}
@keyframes ripple{0%,9%,100%{transform:translate(-50%,-50%) scale(1)}4%{transform:translate(-50%,-50%) scale(1.32)}}
.lt.g{background:#ffe08a;color:#1a1006}                                   /* beheerste noot: goud */
.lt.g.tw{animation:twinkle 1.9s ease-out}
@keyframes twinkle{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 0 22px 8px rgba(255,224,138,.6)}
  60%{opacity:.85;transform:translate(-50%,-50%) scale(1);box-shadow:0 0 12px 3px rgba(255,224,138,.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(.7);box-shadow:0 0 0 0 rgba(255,224,138,0)}}
.lgs{display:flex;justify-content:center;gap:20px;margin-top:8px;font-size:13px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px}.lg i.n{background:var(--teal);box-shadow:0 0 8px var(--teal)}.lg i.g{background:#ffe08a;box-shadow:0 0 8px #ffe08a}
@keyframes breathe{50%{box-shadow:0 0 6px 1px rgba(79,227,208,.25);opacity:.75}}
/* ── akkoordrij onder het bord ── */
.chords{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;margin-top:6px;min-height:52px}
.chords .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);margin-right:8px}
.chords button{border:0;background:none;font-size:28px;font-weight:800;letter-spacing:-.02em;color:rgba(245,239,230,.3);padding:2px 6px;border-radius:10px;transition:color .4s,text-shadow .4s}
.chords button.on{color:var(--tx);text-shadow:0 0 22px rgba(255,181,71,.6)}
.chords .ar{color:#5d574e}
.cnote{text-align:center;font-size:15px;color:var(--mut);min-height:24px}
/* ── kaarten ── */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:64px}
.card{display:grid;gap:16px;align-content:start;padding:28px;border-radius:24px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);text-decoration:none;color:var(--tx);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .2s,transform .2s}
.card:hover{border-color:rgba(255,181,71,.45);transform:translateY(-2px);color:var(--tx)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ck{font-size:36px;font-weight:800;letter-spacing:-.025em;line-height:1.05;color:var(--tx)}   /* titel van de kaart: trekt de aandacht */
.go{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px}
.ct{font-size:19px;font-weight:600;line-height:1.3;color:var(--glow)}   /* status eronder */
.cm{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--mut);font-size:15px}
.cm b{color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:5px 10px;border-radius:10px;font-size:13px;background:rgba(255,255,255,.07);transition:background .4s,color .4s}
.chips span.on{background:var(--glow);color:#1a1006}
/* ── oefenkalender ── */
.cal{position:relative;margin-top:72px;padding:28px;border-radius:24px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);--cs:15px}
.calh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin-bottom:22px}
.calh h2{margin:0;font-size:36px;font-weight:800;letter-spacing:-.025em}
.cst{display:flex;flex-wrap:wrap;gap:10px 30px}.cst div{display:grid}.cst b{font-size:22px;font-weight:700;color:var(--glow)}.cst small{font-size:12px;color:var(--mut)}
.calbox{overflow-x:auto;padding-bottom:6px}
.calmo{display:grid;gap:4px;margin-left:38px;font-size:11px;color:var(--mut2);height:16px;width:max-content}
.calrow{display:flex;gap:8px;width:max-content}
.calwd{display:grid;grid-template-rows:repeat(7,var(--cs));gap:4px;width:30px;font-size:11px;color:var(--mut2)}.calwd span{line-height:var(--cs)}
.calgrid{display:grid;grid-template-rows:repeat(7,var(--cs));grid-auto-flow:column;gap:4px}
.cd{width:var(--cs);height:var(--cs);border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.07);cursor:pointer;transition:transform .15s}
.cd:hover{transform:scale(1.35)}
.cd.fut{background:transparent;cursor:default}.cd.rest:not(.on){background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.cd.on{box-shadow:0 0 8px rgba(255,181,71,.25)}
.cd.met{box-shadow:0 0 0 2px #f5efe6,0 0 12px 2px rgba(255,181,71,.45);opacity:1!important}
.cd.today:not(.met){outline:2px solid var(--glow);outline-offset:2px;animation:pulse 2.4s ease-in-out infinite}
.calf{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.callg{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--mut)}
.callg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.callg i.p{background:var(--violet)}.callg i.c{background:var(--rose)}.callg i.f{background:var(--teal)}.callg i.s{background:var(--glow)}.callg i.m{background:#f5efe6}.callg i.r{background:transparent;box-shadow:inset 0 0 0 2px #f5efe6}
.calbtn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.calbtn:hover,.calbtn[aria-expanded="true"]{border-color:var(--glow)}
.calgoals{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}.calgoals p{margin:0 0 10px;font-size:13px;color:var(--mut)}
.gl{display:flex;flex-wrap:wrap;gap:10px}.gl label{display:grid;gap:4px;font-size:12px;color:var(--mut)}
.gl input{width:84px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:var(--tx);padding:7px 9px;font:inherit;font-size:15px}
.gl small{font-size:11px;color:var(--mut2)}
.caltip{position:absolute;z-index:5;white-space:pre-line;pointer-events:none;background:#16151c;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.45;max-width:340px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.calpop{position:absolute;z-index:6;width:250px;background:#16151c;border:1px solid rgba(255,181,71,.4);border-radius:14px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.calpop p{margin:4px 0 10px;font-size:13px;color:var(--mut)}
.stp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.stp button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--tx);font-size:20px;cursor:pointer}
.stp output{font-size:20px;font-weight:700;color:var(--glow)}
.qk{display:flex;flex-wrap:wrap;gap:6px}.qk button{border:0;border-radius:999px;padding:5px 10px;background:rgba(255,255,255,.08);color:var(--tx);font:inherit;font-size:12px;cursor:pointer}
.qk button:hover,.stp button:hover{background:rgba(255,181,71,.2)}
.foot{margin-top:40px;font-size:13px;color:var(--mut2);text-align:center}
@media (max-width:720px){.cal{padding:20px;--cs:12px}.calh h2{font-size:28px}.wrap{padding:0 16px 40px}.hero{padding-top:24px}.tilt{transform:none}.chords button{font-size:22px}.card{padding:22px}.ck{font-size:28px}.ct{font-size:17px}}
@media (prefers-reduced-motion:reduce){.live,.lt.n.on{animation:none}.lt.g{opacity:.35;transform:translate(-50%,-50%) scale(.8)}.lt,.chords button,.chips span,.card{transition:none}}
.bk{margin-top:28px;display:grid;justify-items:center;text-align:center;color:var(--mut)}.bk .prb-row{justify-content:center}
.prb-row{display:flex;flex-wrap:wrap;gap:8px}.prb-msg{margin:8px 0 0;font-size:13px;line-height:1.45;opacity:.8}
</style>
</head>
<body>
<div class="page">
<div class="wrap">
  <header>
    <div class="brand"><span class="live" aria-hidden="true"></span><span id="brand"></span></div>
    <nav id="nav" aria-label="Trainers"></nav>
    <span class="m" id="date" style="font-size:13px;color:var(--mut)"></span>
  </header>

  <main>
    <section class="hero">
      <div class="kick m" id="greet"></div>
      <h1 id="headline"></h1>
      <p class="sub" id="subline"></p>
    </section>

    <div class="ctr"><div class="seg" role="group" id="modeSeg"><button type="button" data-m="prog"></button><button type="button" data-m="notes"></button></div></div>

    <div class="stage" aria-hidden="true"><div class="tilt"><div class="bwrap"><div class="neck" id="neck"></div></div></div></div>
    <div class="chords" id="chords"></div>
    <p class="cnote" id="cnote" aria-live="polite"></p>

    <section class="tools" id="tools" aria-label="Trainers"></section>

    <!-- oefenkalender: één stip per dag; teal = Fretboard, goud = Scale, violet = Note Prompter, wit = zonder app; ring = dagdoel gehaald -->
    <section class="cal" id="cal" aria-labelledby="calH">
      <div class="calh"><h2 id="calH"></h2><div class="cst" id="calStats"></div></div>
      <div class="calbox"><div class="calmo" id="calMonths"></div><div class="calrow"><div class="calwd" id="calWd"></div><div class="calgrid" id="calGrid" role="grid"></div></div></div>
      <div class="calf"><div class="callg" id="calLegend"></div><button type="button" class="calbtn" id="calGoalsBtn" aria-expanded="false"></button></div>
      <div class="calgoals" id="calGoals" hidden></div>
      <div class="caltip" id="calTip" role="tooltip" hidden></div>
      <div class="calpop" id="calPop" role="dialog" hidden></div>
    </section>
    <section class="bk" aria-label="Backup"><div id="prBackup" data-app="Home" data-btn="calbtn"></div></section>
    <p class="foot" id="foot"></p>
  </main>
</div>
</div>

<script>

/* ══ BACK-UP · gelijk in alle Practice Room-pagina's (Home, Fretboard Trainer, Scale Trainer, Note Prompter, Chord Moves) ══════
   Exporteren: alle Practice Room-gegevens die deze pagina kan zien → één .json-bestand in je Downloads.
   Importeren: één of meer van die bestanden → samenvoegen met wat er al is → pagina herladen.
     · Instellingen, voortgang en progressies: de geïmporteerde versie vervangt de huidige.
     · Oefenlogboeken en zelf ingevulde minuten (kalender): per dag samengevoegd, de hoogste waarde blijft.
   Het wegschrijven gebeurt ná het herladen en vóórdat de app zijn gegevens leest, zodat de app ze niet meteen
   weer overschrijft met wat hij nog in zijn geheugen had.
   Knoppen verschijnen in elk element met id="prBackup" (data-app = naam van de pagina, data-btn = knopstijl). */
var PRB=(function(){
  'use strict';
  var RX=/^(fretTrainer|toonladderTrainer|practiceRoom|notePrompter|chordMoves)/;
  var APPS=[['fretTrainer','Fretboard Trainer'],['toonladderTrainer','Scale Trainer'],['notePrompter','Note Prompter'],['chordMoves','Chord Moves'],['practiceRoom','Home and shared settings']];
  var LOGS=/(\.log|:log|^practiceRoom\.manual)$/;
  var TXT={exp:'Export backup',imp:'Import backup…',
    saved:function(f,list){return 'Saved '+f+' with: '+list+'.';},
    missing:function(list){return ' Not visible from this page: '+list+'. If you used that in this browser, export from there too.';},
    done:function(list,n){return 'Imported '+n+' item'+(n===1?'':'s')+': '+list+'.';},
    none:'Nothing to export yet.',bad:function(n){return n+' file'+(n===1?' is':'s are')+' not a Practice Room backup.';},
    note:'One file with your progress, settings and practice log. Use it to move to another browser or computer.'};
  var ls=null;try{ls=window.localStorage;}catch(e){}

  /* een vorige import afmaken (na het herladen, vóór de app iets leest) */
  try{var pend=sessionStorage.getItem('prImport');
    if(pend&&ls){sessionStorage.removeItem('prImport');var P=JSON.parse(pend);
      Object.keys(P.data).forEach(function(k){if(RX.test(k))ls.setItem(k,P.data[k]);});
      sessionStorage.setItem('prImportDone',JSON.stringify({apps:P.apps,n:P.n,bad:P.bad}));}}catch(e){}

  function appsIn(keys){return APPS.filter(function(a){return keys.some(function(k){return k.indexOf(a[0])===0;});}).map(function(a){return a[1];});}
  function snapshot(){var d={};if(!ls)return d;for(var i=0;i<ls.length;i++){var k=ls.key(i);if(k&&RX.test(k))d[k]=ls.getItem(k);}return d;}
  /* logboeken per dag samenvoegen: de grootste waarde (seconden of minuten) wint */
  function mergeLog(a,b){var A,B;try{A=JSON.parse(a)||{};}catch(e){A={};}try{B=JSON.parse(b)||{};}catch(e){return a;}
    var size=function(v){return typeof v==='number'?v:v&&typeof v==='object'?(+v.s||0):0;};
    Object.keys(B).forEach(function(day){if(!(day in A)||size(B[day])>size(A[day]))A[day]=B[day];});
    return JSON.stringify(A);}
  function stamp(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

  function doExport(app,msg){var data=snapshot(),keys=Object.keys(data);
    if(!keys.length){msg(TXT.none);return;}
    var file='practice-room-backup-'+stamp()+'.json';
    var blob=new Blob([JSON.stringify({type:'practice-room-backup',v:1,created:new Date().toISOString(),from:app,data:data},null,1)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},3000);
    var have=appsIn(keys),miss=APPS.slice(0,4).map(function(x){return x[1];}).filter(function(n){return have.indexOf(n)<0;});
    msg(TXT.saved(file,have.join(', '))+(miss.length?TXT.missing(miss.join(', ')):''));}

  function doImport(files,msg){
    Promise.all([].map.call(files,function(f){return f.text();})).then(function(texts){
      var cur=snapshot(),out={},bad=0;
      texts.forEach(function(t){var o;try{o=JSON.parse(t);}catch(e){o=null;}
        if(!o||o.type!=='practice-room-backup'||!o.data||typeof o.data!=='object'){bad++;return;}
        Object.keys(o.data).forEach(function(k){var v=o.data[k];if(!RX.test(k)||typeof v!=='string')return;
          var base=k in out?out[k]:cur[k];out[k]=LOGS.test(k)&&base!=null?mergeLog(base,v):v;});});
      var keys=Object.keys(out);
      if(!keys.length){msg(TXT.bad(bad||files.length));return;}
      try{sessionStorage.setItem('prImport',JSON.stringify({data:out,apps:appsIn(keys),n:keys.length,bad:bad}));}catch(e){msg('Could not import: '+e.message);return;}
      location.reload();});}

  function mount(){var el=document.getElementById('prBackup');if(!el||el.dataset.ready)return;el.dataset.ready='1';
    var app=el.dataset.app||document.title,cls=el.dataset.btn||'';
    el.innerHTML='<div class="prb-row"><button type="button" class="'+cls+'" data-prb="exp">'+TXT.exp+'</button>'
      +'<button type="button" class="'+cls+'" data-prb="imp">'+TXT.imp+'</button>'
      +'<input type="file" accept=".json,application/json" multiple hidden aria-label="Backup files"></div>'
      +'<p class="prb-msg" role="status">'+TXT.note+'</p>';
    var m=el.querySelector('.prb-msg'),inp=el.querySelector('input'),msg=function(t){m.textContent=t;};
    el.querySelector('[data-prb="exp"]').onclick=function(){doExport(app,msg);};
    el.querySelector('[data-prb="imp"]').onclick=function(){inp.value='';inp.click();};
    inp.onchange=function(){if(inp.files&&inp.files.length)doImport(inp.files,msg);};

  return{cur:run,best};}
function renderCal(){const T=TEXT.cal,L=calLogs(),G=goals(),today=new Date();today.setHours(0,0,0,0);
  const weeks=innerWidth>1150?CAL.weeksWide:CAL.weeksNarrow,start=addDays(today,-wdIdx(today)-7*(weeks-1));
  let cells='',months='',lastM=-1;
  for(let w=0;w<weeks;w++){const ws=addDays(start,7*w);
    if(ws.getMonth()!==lastM){lastM=ws.getMonth();months+='<span style="grid-column:'+(w+1)+'">'+ws.toLocaleDateString('en-GB',{month:'short'})+'</span>';}
    for(let r=0;r<7;r++){const d=addDays(ws,r),k=dKey(d),fut=d>today,i=dayInfo(L,k,d,G);
      if(fut){cells+='<span class="cd fut"></span>';continue;}
      let bg='';if(i.t>0){const a=i.f/i.t*360,b=a+i.sc/i.t*360,c=b+i.p/i.t*360,e=c+i.cm/i.t*360;bg='background:conic-gradient(var(--teal) 0 '+a+'deg,var(--glow) '+a+'deg '+b+'deg,var(--violet) '+b+'deg '+c+'deg,var(--rose) '+c+'deg '+e+'deg,#f5efe6 '+e+'deg 360deg);opacity:'+(.35+.65*Math.min(1,i.t/(i.g||20))).toFixed(2)+';';}
      cells+='<button type="button" class="cd'+(i.t>0?' on':'')+(i.met?' met':'')+(i.rest?' rest':'')+(+d===+today?' today':'')+'" data-k="'+k+'" style="'+bg+'" aria-label="'+esc(calLabel(i,d))+'"></button>';}}
  $('#calGrid').style.gridTemplateColumns='repeat('+weeks+',var(--cs))';$('#calMonths').style.gridTemplateColumns='repeat('+weeks+',var(--cs))';
  $('#calGrid').innerHTML=cells;$('#calMonths').innerHTML=months;
  const box=$('.calbox');box.scrollLeft=box.scrollWidth;                              /* smal scherm: vandaag in beeld */
  $('#calWd').innerHTML=T.wd.map((x,j)=>'<span>'+(j%2?'':esc(x))+'</span>').join('');
  /* cijfers: reeks, langste reeks, deze week, deze maand */
  const st=streaks(L,G),mon=addDays(today,-wdIdx(today)),first=new Date(today.getFullYear(),today.getMonth(),1);let wk=0,mo=0;
  for(let d=new Date(Math.min(+mon,+first));d<=today;d=addDays(d,1)){const t=dayInfo(L,dKey(d),d,G).t;if(d>=mon)wk+=t;if(d>=first)mo+=t;}
  const ti=dayInfo(L,dKey(today),today,G);
  $('#calStats').innerHTML=[[st.cur,T.streak(st.cur)],[st.best,T.best],[fmtMin(wk),T.week],[fmtMin(mo),T.month],[ti.rest?T.rest:fmtMin(ti.t)+' / '+fmtMin(ti.g),T.today]]
    .map(([v,l])=>'<div><b>'+esc(String(v))+'</b><small>'+esc(l)+'</small></div>').join('');
  $('#calLegend').innerHTML=[['f',T.fret],['s',T.scale],['p',T.prompt],['c',T.moves],['m',T.manual],['r',T.goalMet]].map(([c,l])=>'<span><i class="'+c+'"></i>'+esc(l)+'</span>').join('');}
function calLabel(i,d){const T=TEXT.cal,parts=[];
  if(i.f)parts.push(T.fretT(fmtMin(i.f),i.fe&&i.fe.n,i.fe&&i.fe.n?Math.round(100*i.fe.ok/i.fe.n):null));
  if(i.sc)parts.push(T.scaleT(fmtMin(i.sc),i.se&&i.se.p&&i.se.p.length?i.se.p.join(', '):''));
  if(i.p)parts.push(T.promptT(fmtMin(i.p),i.pe&&i.pe.n));
  if(i.cm)parts.push(T.movesT(fmtMin(i.cm),i.me&&Array.isArray(i.me.p)&&i.me.p.length?i.me.p.join(', '):''));
  if(i.m)parts.push(T.manT(fmtMin(i.m)));
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' · '+(i.t?fmtMin(i.t):T.none)+(i.rest?' · '+T.rest:' · '+T.goal(fmtMin(i.g)))+(parts.length?'\n'+parts.join('\n'):'');}
/* zelf invullen: klik op een dag → minuten zonder app (stappen van 5) */
function calPop(btn){const T=TEXT.cal,k=btn.dataset.k,[y,mo,da]=k.split('-').map(Number),d=new Date(y,mo-1,da),man=read('practiceRoom.manual')||{},v=+man[k]||0;
  const pop=$('#calPop');pop.dataset.k=k;
  pop.innerHTML='<b>'+esc(d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}))+'</b><p>'+esc(T.popQ)+'</p>'
    +'<div class="stp"><button type="button" data-d="-'+CAL.step+'" aria-label="'+esc(T.less)+'">−</button><output>'+fmtMin(v)+'</output><button type="button" data-d="'+CAL.step+'" aria-label="'+esc(T.more)+'">+</button></div>'
    +'<div class="qk">'+[15,30,45,60].map(m=>'<button type="button" data-set="'+m+'">'+m+'</button>').join('')+'<button type="button" data-set="0">'+esc(T.clear)+'</button></div>';
  const r=btn.getBoundingClientRect(),box=$('#cal').getBoundingClientRect();pop.hidden=false;
  pop.style.left=Math.max(0,Math.min(box.width-pop.offsetWidth,r.left-box.left-pop.offsetWidth/2+r.width/2))+'px';pop.style.top=(r.bottom-box.top+10)+'px';}
function calSetMan(k,v){const man=read('practiceRoom.manual')||{};if(v>0)man[k]=v;else delete man[k];
  try{localStorage.setItem('practiceRoom.manual',JSON.stringify(man));}catch(e){}renderCal();
  const b=document.querySelector('#calGrid [data-k="'+k+'"]');if(b&&!$('#calPop').hidden){$('#calPop output').textContent=fmtMin(v);}}
function renderGoals(){const T=TEXT.cal,G=goals();
  $('#calGoals').innerHTML='<p>'+esc(T.goalsHelp)+'</p><div class="gl">'+T.wdLong.map((x,j)=>'<label><span>'+esc(x)+'</span><input type="number" min="0" max="600" step="5" data-g="'+j+'" value="'+G[j]+'"><small>min</small></label>').join('')+'</div>';}
function bindCal(){const T=TEXT.cal;$('#calH').textContent=T.title;$('#calGoalsBtn').textContent=T.goalsBtn;
  const tip=$('#calTip'),pop=$('#calPop');
  $('#calGrid').addEventListener('mouseover',e=>{const b=e.target.closest('.cd[data-k]');if(!b){tip.hidden=true;return;}
    tip.textContent=b.getAttribute('aria-label');tip.hidden=false;const r=b.getBoundingClientRect(),box=$('#cal').getBoundingClientRect();
    tip.style.left=Math.max(0,Math.min(box.width-tip.offsetWidth,r.left-box.left-tip.offsetWidth/2+r.width/2))+'px';tip.style.top=(r.top-box.top-tip.offsetHeight-10)+'px';});
  $('#calGrid').addEventListener('mouseleave',()=>{tip.hidden=true;});
  $('#calGrid').addEventListener('click',e=>{const b=e.target.closest('.cd[data-k]');if(!b)return;tip.hidden=true;
    if(!pop.hidden&&pop.dataset.k===b.dataset.k){pop.hidden=true;return;}calPop(b);});
  pop.addEventListener('click',e=>{const k=pop.dataset.k,man=read('practiceRoom.manual')||{},v=+man[k]||0,b=e.target.closest('button');if(!b)return;
    if(b.dataset.d)calSetMan(k,Math.max(0,Math.min(600,v+ +b.dataset.d)));else if(b.dataset.set!=null)calSetMan(k,+b.dataset.set);});
  document.addEventListener('click',e=>{if(!pop.hidden&&!e.target.closest('#calPop,#calGrid'))pop.hidden=true;});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')pop.hidden=true;});
  $('#calGoalsBtn').addEventListener('click',()=>{const g=$('#calGoals'),open=g.hidden;g.hidden=!open;$('#calGoalsBtn').setAttribute('aria-expanded',open);if(open)renderGoals();});
  $('#calGoals').addEventListener('input',e=>{const i=e.target.closest('[data-g]');if(!i)return;const G=goals();G[+i.dataset.g]=Math.max(0,Math.min(600,+i.value||0));
    try{localStorage.setItem('practiceRoom.goals',JSON.stringify(G));}catch(x){}renderCal();});
  let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(renderCal,200);});   /* breedte wijzigt → aantal weken opnieuw */
  renderCal();}

function init(){
  document.title=CONFIG.brand;$('#brand').textContent=CONFIG.brand;
  $('#greet').textContent=greeting();$('#headline').textContent=CONFIG.headline;$('#foot').textContent=CONFIG.footer;
  $('#date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  $('#nav').innerHTML=TOOLS.map(t=>'<a href="'+esc(t.file)+'">'+esc(t.name)+'</a>').join('');
  document.querySelectorAll('#modeSeg button').forEach(b=>{b.textContent=CONFIG.toggle[b.dataset.m];b.onclick=()=>setMode(b.dataset.m);});
  $('#modeSeg').setAttribute('aria-label','What the board shows');
  $('#tools').innerHTML=TOOLS.map(card).join('');
  /* klik op de Scale Trainer-kaart opent direct die progressie */
  $('#tools').addEventListener('click',e=>{const a=e.target.closest('a[data-prog]');if(!a)return;
    try{const s=read('toonladderTrainer:v1'),d=scaleData();if(s&&d){s.view=s.view||{};s.view.mode='prog';s.view.prog=d.p.id;localStorage.setItem('toonladderTrainer:v1',JSON.stringify(s));}}catch(x){}});
  $('#chords').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;
    clearTimeout(hold);light(+b.dataset.i);hold=setTimeout(()=>{hold=null;if(!reduce)schedule();},8000);clearTimeout(timer);});
  applyWood();buildNeck();bindCal();
  const saved=read('practiceRoom.home'),fd=fretData();
  setMode(saved&&(saved.mode==='notes'||saved.mode==='prog')?saved.mode:(scaleData()||!fd||!fd.due.length?'prog':'notes'));
  addEventListener('storage',e=>{if(e.key==='practiceRoom.board')applyWood();});}
init();
})();
</script>
