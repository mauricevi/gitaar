<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scale Trainer</title>
<style>
/* ════════════════════════════════════════════════════════════════════════════
   SCALE TRAINER · v2 (Practice Room)
   Indeling: zijbalk · werkbalk · kaarten A en B · akkoorden van A → B · bord · vergelijking · instellingen.
   Zelfde Apple-stijl en effen houten bord als de Fretboard Trainer.
   Opslag: localStorage 'toonladderTrainer:v1' (ongewijzigd, dus je instellingen blijven bewaard).
   Houtkleur: gedeeld met de andere tools via 'practiceRoom.board'.
   ════════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f2f2f7;--card:#ffffff;--side:rgba(255,255,255,.6);--tx:#1c1c1e;--mut:#6c6c70;--mut2:#8e8e93;
  --sep:rgba(60,60,67,.14);--fill:rgba(118,118,128,.12);--seg-on:#ffffff;
  --ac:#0a63d6;--link:#0a63d6;--onac:#ffffff;--err:#c4302b;--sh:0 1px 2px rgba(0,0,0,.04);--chip:rgba(118,118,128,.12);
  --wd1:#3e2518;--wfret:rgba(205,198,186,.32);--wnut:#d9d3c7;--wstr:#d6cfc1;--winl:rgba(232,225,210,.32);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1c1c1e;--side:rgba(28,28,30,.75);--tx:#f5f5f7;--mut:#a1a1a6;--mut2:#8e8e93;
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--seg-on:#636366;--chip:rgba(118,118,128,.24);
  --ac:#1f6fe5;--link:#5aa2ff;--err:#ff6961;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1c1c1e;--side:rgba(28,28,30,.75);--tx:#f5f5f7;--mut:#a1a1a6;--mut2:#8e8e93;
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--seg-on:#636366;--chip:rgba(118,118,128,.24);
  --ac:#1f6fe5;--link:#5aa2ff;--err:#ff6961;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
button,select,input{font:inherit;color:var(--tx)}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,.sw:focus-within,.tg:focus-within{outline:3px solid var(--ac);outline-offset:2px}
p{margin:0}
/* ── app-indeling ── */
.app{display:flex;min-height:100vh}
.side{flex:0 0 220px;position:sticky;top:0;height:100vh;padding:22px 12px;border-right:1px solid var(--sep);background:var(--side);display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.brand,.sh2{font-size:13px;font-weight:600;color:var(--mut);padding:0 10px 10px}
.sh2{padding:18px 10px 4px;font-size:12px}
.side nav{display:grid;gap:2px}
.side a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:9px;text-decoration:none;color:var(--tx);font-size:15px}
.side a:hover{background:var(--fill)}
.side a.on{background:rgba(10,99,214,.13);color:var(--link);font-weight:600}
.side a.cur{font-weight:600}
main{flex:1;min-width:0;max-width:var(--mainw,1320px);padding:20px 28px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.tb{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.15}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.tr{display:flex;gap:8px}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--sh);min-width:0}
.cap{font-size:13px;color:var(--mut)}
h2{font-size:17px;font-weight:700;margin:0}
h3{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:0 0 8px}
.ib{width:36px;height:36px;padding:0;border-radius:9px;border:0;background:var(--fill);display:grid;place-items:center}
.ib:disabled{opacity:.4;cursor:default}
.act{min-height:34px;padding:0 14px;border-radius:9px;border:0;background:var(--fill);font-size:14px;font-weight:600}
.act.pri{background:var(--ac);color:var(--onac)}
.chip{border:0;background:var(--chip);border-radius:999px;padding:6px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--onac);font-weight:600}
select,input[type=text],input[type=number]{background:var(--card);border:1px solid var(--sep);border-radius:9px;padding:7px 9px;min-width:0;max-width:100%;font-size:14px}
input[type=range]{accent-color:var(--ac);width:100%;max-width:200px}
input[type=color]{padding:0;border:1px solid var(--sep);border-radius:8px;width:40px;height:30px;background:var(--card)}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{border:0;background:none;border-radius:7px;min-height:30px;padding:0 13px;font-size:13px;color:var(--tx)}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}
/* ── kaarten A en B ── */
#rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
.srow{display:grid;gap:14px;align-content:start}
.sch{display:flex;align-items:center;gap:14px}
.sw{position:relative;flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--ct);display:grid;place-items:center;font-weight:750;font-size:18px;cursor:pointer;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--sep)}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.scn{flex:1;min-width:0}
.scn b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{position:relative;flex:none;display:inline-flex;cursor:pointer}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg i{width:46px;height:28px;border-radius:14px;background:var(--fill);position:relative;transition:background .15s}
.tg i::after{content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .15s}
.tg input:checked+i{background:#34c759}.tg input:checked+i::after{transform:translateX(18px)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:4px;font-size:12px;color:var(--mut);min-width:0}
.fld select{width:100%}
.fml{width:100%}
.err{color:var(--err);font-size:13px}
.notes{display:flex;flex-wrap:wrap;gap:6px;min-height:3rem;align-content:flex-start}
.srow.off .fields,.srow.off .notes,.srow.off .fml{opacity:.4;pointer-events:none}
.srow.off .sw{opacity:.4}
.nc{display:inline-grid;justify-items:center;min-width:2.5rem;padding:4px 8px 3px;border-radius:9px;background:var(--chip);border-bottom:3px solid var(--c);line-height:1.2;transition:transform .12s}
.nc b{font-size:15px;font-weight:600}
.nc i{font-style:normal;font-size:11px;color:var(--mut)}
.nc.r b{font-weight:800}
.nc.playing{outline:2px solid var(--ac);outline-offset:1px;transform:translateY(-2px)}
.ib.play[aria-pressed="true"]{background:var(--ac);color:var(--onac)}
/* ── akkoorden van A → B ── */
.dh{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;min-height:3.6rem}
.dc{display:grid;justify-items:start;align-content:center;gap:2px;padding:10px 12px;min-width:0;border-radius:12px;border:1px solid var(--sep);background:var(--card);line-height:1.15;text-align:left;min-height:62px}
.dc b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dc small{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dc:hover:not(:disabled){border-color:var(--ac)}
.dc[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.dc[aria-pressed="true"] small{color:var(--onac);opacity:.85}
.dc:disabled{opacity:.4;cursor:default}
.dnote{grid-column:1/-1;font-size:14px;color:var(--mut);align-self:center}
.xmore{margin-top:12px}
.xmore>summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--link);list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.xmore>summary::-webkit-details-marker{display:none}
.xmore>summary::before{content:"›";display:inline-block;transition:transform .15s}
.xmore[open]>summary::before{transform:rotate(90deg)}
.xmore .cap{font-weight:400}
.xpick{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:10px}
.xf{display:grid;gap:4px;font-size:12px;color:var(--mut)}
.xq select{min-width:12rem}
@media(max-width:620px){.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* ── bord ── */
.posbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin:14px 0 12px}
.pf{display:grid;gap:4px;font-size:12px;color:var(--mut);min-width:0}
.pf select{max-width:280px}
.pf .rng{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px}
.pf input[type=number]{width:4.6rem}
.pf.inv{visibility:hidden}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:stretch;min-height:3.1rem}
.pc{display:grid;justify-items:center;align-content:center;min-width:3.6rem;padding:5px 12px;line-height:1.15;border-radius:12px}
.pc b{font-size:15px}
.pc small{font-size:11px;opacity:.8}
.step{padding:5px 13px;border-radius:12px;font-size:16px}
.bwrap{overflow-x:auto;border-radius:12px}
#board{min-width:min(var(--bw,1150px),max(100%,720px))}   /* past in de kaart; op smalle schermen scrollt het bord */
#board svg{display:block;width:100%;height:auto}
#board.zoom{min-width:0}
.bwood{fill:var(--wd1)}
.wire{stroke:var(--wfret)}
.nutr{fill:var(--wnut)}
.strl{stroke:var(--wstr)}
.stro{stroke:var(--mut2);opacity:.45}
.inl{fill:var(--winl)}
.fnum{fill:var(--mut2);font-size:11px;text-anchor:middle}
.fnum.k{font-weight:700;fill:var(--tx)}
.snm{fill:var(--mut2);font-size:12px;font-weight:600;text-anchor:middle}
.band{fill:var(--ac);fill-opacity:.14;stroke:var(--ac);stroke-width:1.5;stroke-dasharray:5 4}
.band.bk{fill:var(--bc);stroke:var(--bc);fill-opacity:.1}.bandl.bk{fill:var(--bc)}
.shp{fill:none;stroke:#e5484d;stroke-width:2.2;stroke-dasharray:3 2}
.fmap{display:grid;gap:6px;margin:4px 0 10px}
.frow{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:start}
.fl{display:flex;align-items:baseline;gap:6px;min-width:0;padding-top:3px}
.fl i{font-style:normal;font-size:11px;font-weight:800;color:var(--fcT);background:var(--fc);border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center;flex:none}
.fl b{font-size:14px}.fl small{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftrack{position:relative;min-height:22px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/23 - 1px),var(--sep) calc(100%/23 - 1px) calc(100%/23));border-radius:6px}
.fb{position:absolute;height:20px;border:1.5px solid var(--fc);background:transparent;color:var(--fc);border-radius:6px;font:700 11px/1 inherit;cursor:pointer;padding:0}
.fb:hover{background:color-mix(in srgb,var(--fc) 14%,transparent)}
.fb.on{background:var(--fc);color:var(--fcT)}
.frow.ruler .ftrack{background:none;height:14px;min-height:0}
.frow.ruler .ftrack span{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--mut)}
.bandl{fill:var(--link);font-size:12px;font-weight:700;text-anchor:middle}
.n .core{stroke:rgba(0,0,0,.55);stroke-width:1.2}
.n text{font-weight:700;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.n.dim{opacity:.55}
.n.faint{opacity:.22}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--mut);align-items:center}
.lg{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.lg i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.35)}
.lg i.ring{background:none;border:2.5px solid currentColor}
.lg .dg{display:inline-flex;gap:3px}
.lg .dg span{padding:1px 7px;border-radius:999px;font-size:12px;font-weight:700}
.hint{margin-top:8px;font-size:12px;color:var(--mut)}
/* ── vergelijking ── */
.sum{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0;font-size:14px}
.sum span{display:inline-flex;gap:6px;align-items:center}
.sum i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.3)}
.stripw{overflow-x:auto;margin-bottom:14px}
.strip{display:grid;grid-template-columns:3.4rem repeat(12,minmax(2.5rem,1fr));gap:4px;min-width:600px;align-items:center}
.strip .h{font-size:12px;color:var(--mut);text-align:center}
.strip .l{font-size:13px;font-weight:700}
.cc{height:2.8rem;border-radius:9px;display:grid;place-items:center;align-content:center;font-size:14px;font-weight:650;line-height:1.15;background:var(--chip);color:var(--mut)}
.cc small{font-size:11px;font-weight:500;opacity:.85}
.cc.on{background:var(--c);color:var(--ct)}
.cc.res{height:.6rem;border-radius:999px}
.cc.res.x{background:var(--c)}
.lists{display:grid;gap:8px}
.li{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.li>b{font-size:13px;min-width:9.5rem;color:var(--mut);font-weight:600}
.tag{padding:2px 9px;border-radius:999px;font-size:13px;background:var(--c);color:var(--ct);font-weight:600}
.tag.plain{background:var(--chip);color:var(--tx)}
/* ── instellingen ── */
details.panel{padding:0}
details.panel>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:58px;padding:0 22px;font-size:17px;font-weight:600;cursor:pointer}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary .cap{font-weight:400;font-size:14px;margin-left:auto}
details.panel>summary::after{content:"›";color:var(--mut2);font-size:22px;transition:transform .15s}
details.panel[open]>summary::after{transform:rotate(90deg)}
.pbody{padding:0 22px 22px;border-top:1px solid var(--sep)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:26px;margin-top:18px}
.sg{display:grid;gap:10px;align-content:start;min-width:0}
.sr{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;min-width:0}
.sr>label{flex:1 1 auto}
.sr .v{display:flex;gap:8px;align-items:center;flex:0 1 auto;min-width:0}
.v input[type=range]{width:150px;min-width:150px;flex:none}   /* schuifje niet laten inklappen naast een lang label */
.v select{min-width:150px}
.sg.wide{grid-column:1/-1}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:8px 32px}
.spc{display:inline-block;min-width:74px;font-weight:700}
.spmore summary{cursor:pointer;color:var(--mut);font-size:14px;margin:6px 0 10px}
.rv{min-width:3.2rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.6rem,1fr));gap:8px}
.pal label{display:grid;gap:3px;justify-items:center;font-size:12px;color:var(--mut)}
.pal input{width:100%}
.woods{display:flex;flex-wrap:wrap;gap:10px}
.wood{position:relative;display:grid;justify-items:center;gap:4px;border:0;background:none;cursor:pointer;font-size:12px;color:var(--mut);padding:2px}
.wood i{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.wood[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ac)}
.wood[aria-pressed="true"]{color:var(--tx);font-weight:600}
.wood input{position:absolute;opacity:0;width:1px;height:1px}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--sep);font-size:13px;color:var(--mut)}
/* ── progressies ── */
.side{overflow-y:auto}
.side .nb{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:9px;border:0;background:none;width:100%;text-align:left;font-size:14px;color:var(--tx)}
.side .nb:hover{background:var(--fill)}
.side .nb.on{background:rgba(10,99,214,.13);color:var(--link);font-weight:600}
.side .nb span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .nb small{color:var(--mut2);font-size:12px;font-weight:400}
.side .nb.add{color:var(--link)}
.plist{display:grid;gap:2px}
.tr .act{min-height:36px}
.tempo{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);background:var(--fill);border-radius:9px;padding:0 4px 0 10px}
.tempo input{width:4.2rem;border:0;background:transparent;text-align:right;font-weight:600}
.trn{padding:0 2px;gap:2px}
.seg.so{flex-wrap:wrap}
.grpt .info{margin-left:6px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--link);background:none;color:var(--link);font:italic 700 11px/1 Georgia,serif;text-transform:none;vertical-align:-3px;cursor:pointer;padding:0}
.grpt .info:hover{background:var(--link);color:var(--onac)}
#inBody .lead{font-size:15px;line-height:1.55;margin:0}
#inBody h3{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);margin:0 0 8px}
#inBody ol{margin:0;padding-left:20px;line-height:1.6;font-size:14px}
.supt .sr.m{grid-template-columns:80px 1fr 1.6fr}.supt .sr.m2{grid-template-columns:80px 1fr}
.fhd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
.fhd .cap{text-transform:none;letter-spacing:0;font-weight:400}
.fhd .info{margin-left:auto;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--link);background:none;color:var(--link);font:italic 700 11px/1 Georgia,serif;text-transform:none;cursor:pointer;padding:0}
.fhd .info:hover{background:var(--link);color:var(--onac)}
.shp.on{stroke-dasharray:none;stroke-width:2;opacity:.9}
.supt{background:var(--card);border-radius:12px;overflow:hidden}
.supt .sr{display:grid;grid-template-columns:88px 1.4fr 1fr 1.6fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--sep);font-size:13px;line-height:1.4}
.supt .sr:last-child{border-bottom:0}
.supt .sr.hd{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);padding-top:8px;padding-bottom:8px}
.supt .sr .ch{font-weight:700}
.supt .sr b{display:block;font-weight:600}.supt .sr small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.supt .sr.hit{background:rgba(255,159,10,.14);box-shadow:inset 3px 0 0 #ff9f0a}
.supt .sr.hit small{color:var(--tx);font-weight:600}
.bpop .lrow span .sub{display:block;font-size:11px;color:var(--mut);line-height:1.3;margin-top:2px;max-width:200px}
.loopr{margin-top:12px;border-top:1px solid var(--sep);padding-top:10px}
.lhd{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin-bottom:6px;min-height:24px}
.lhd>span:first-child{font-weight:600;color:var(--tx)}
.lhd b{color:#c26a00}
.lcells{display:flex;flex-wrap:wrap;gap:2px;user-select:none;-webkit-user-select:none}
.lc{flex:1 0 54px;max-width:120px;display:flex;flex-direction:column;gap:1px;padding:4px 6px 5px;background:var(--fill);border-top:3px solid transparent;cursor:pointer;min-width:0}
.lc small{font-size:10px;color:var(--mut)}
.lc b{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>

/* ══ BACK-UP · gelijk in alle Practice Room-pagina's (Home, Fretboard Trainer, Scale Trainer, Note Prompter, Chord Moves) ══════
   Exporteren: alle Practice Room-gegevens die deze pagina kan zien → één .json-bestand in je Downloads.
   Importeren: één of meer van die bestanden → samenvoegen met wat er al is → pagina herladen.
     · Instellingen, voortgang en progressies: de geïmporteerde versie vervangt de huidige.
     · Oefenlogboeken en zelf ingevulde minuten (kalender): per dag samengevoegd, de hoogste waarde blijft.
   Het wegschrijven gebeurt ná het herladen en vóórdat de app zijn gegevens leest, zodat de app ze niet meteen
   weer overschrijft met wat hij nog in zijn geheugen had.
   Knoppen verschijnen in elk element met id="prBackup" (data-app = naam van de pagina, data-btn = knopstijl). */
var PRB=(function(){
  'use strict';
  var RX=/^(fretTrainer|toonladderTrainer|practiceRoom|notePrompter|chordMoves)/;
  var APPS=[['fretTrainer','Fretboard Trainer'],['toonladderTrainer','Scale Trainer'],['notePrompter','Note Prompter'],['chordMoves','Chord Moves'],['practiceRoom','Home and shared settings']];
  var LOGS=/(\.log|:log|^practiceRoom\.manual)$/;
  var TXT={exp:'Export backup',imp:'Import backup…',
    saved:function(f,list){return 'Saved '+f+' with: '+list+'.';},
    missing:function(list){return ' Not visible from this page: '+list+'. If you used that in this browser, export from there too.';},
    done:function(list,n){return 'Imported '+n+' item'+(n===1?'':'s')+': '+list+'.';},
    none:'Nothing to export yet.',bad:function(n){return n+' file'+(n===1?' is':'s are')+' not a Practice Room backup.';},
    note:'One file with your progress, settings and practice log. Use it to move to another browser or computer.'};
  var ls=null;try{ls=window.localStorage;}catch(e){}

  /* een vorige import afmaken (na het herladen, vóór de app iets leest) */
  try{var pend=sessionStorage.getItem('prImport');
    if(pend&&ls){sessionStorage.removeItem('prImport');var P=JSON.parse(pend);
      Object.keys(P.data).forEach(function(k){if(RX.test(k))ls.setItem(k,P.data[k]);});
      sessionStorage.setItem('prImportDone',JSON.stringify({apps:P.apps,n:P.n,bad:P.bad}));}}catch(e){}

  function appsIn(keys){return APPS.filter(function(a){return keys.some(function(k){return k.indexOf(a[0])===0;});}).map(function(a){return a[1];});}
  function snapshot(){var d={};if(!ls)return d;for(var i=0;i<ls.length;i++){var k=ls.key(i);if(k&&RX.test(k))d[k]=ls.getItem(k);}return d;}
  /* logboeken per dag samenvoegen: de grootste waarde (seconden of minuten) wint */
  function mergeLog(a,b){var A,B;try{A=JSON.parse(a)||{};}catch(e){A={};}try{B=JSON.parse(b)||{};}catch(e){return a;}
    var size=function(v){return typeof v==='number'?v:v&&typeof v==='object'?(+v.s||0):0;};
    Object.keys(B).forEach(function(day){if(!(day in A)||size(B[day])>size(A[day]))A[day]=B[day];});
    return JSON.stringify(A);}
  function stamp(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

  function doExport(app,msg){var data=snapshot(),keys=Object.keys(data);
    if(!keys.length){msg(TXT.none);return;}
    var file='practice-room-backup-'+stamp()+'.json';
    var blob=new Blob([JSON.stringify({type:'practice-room-backup',v:1,created:new Date().toISOString(),from:app,data:data},null,1)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},3000);
    var have=appsIn(keys),miss=APPS.slice(0,4).map(function(x){return x[1];}).filter(function(n){return have.indexOf(n)<0;});
    msg(TXT.saved(file,have.join(', '))+(miss.length?TXT.missing(miss.join(', ')):''));}

  function doImport(files,msg){
    Promise.all([].map.call(files,function(f){return f.text();})).then(function(texts){
      var cur=snapshot(),out={},bad=0;
      texts.forEach(function(t){var o;try{o=JSON.parse(t);}catch(e){o=null;}
        if(!o||o.type!=='practice-room-backup'||!o.data||typeof o.data!=='object'){bad++;return;}
        Object.keys(o.data).forEach(function(k){var v=o.data[k];if(!RX.test(k)||typeof v!=='string')return;
          var base=k in out?out[k]:cur[k];out[k]=LOGS.test(k)&&base!=null?mergeLog(base,v):v;});});
      var keys=Object.keys(out);
      if(!keys.length){msg(TXT.bad(bad||files.length));return;}
      try{sessionStorage.setItem('prImport',JSON.stringify({data:out,apps:appsIn(keys),n:keys.length,bad:bad}));}catch(e){msg('Could not import: '+e.message);return;}
      location.reload();});}

  function mount(){var el=document.getElementById('prBackup');if(!el||el.dataset.ready)return;el.dataset.ready='1';
    var app=el.dataset.app||document.title,cls=el.dataset.btn||'';
    el.innerHTML='<div class="prb-row"><button type="button" class="'+cls+'" data-prb="exp">'+TXT.exp+'</button>'
      +'<button type="button" class="'+cls+'" data-prb="imp">'+TXT.imp+'</button>'
      +'<input type="file" accept=".json,application/json" multiple hidden aria-label="Backup files"></div>'
      +'<p class="prb-msg" role="status">'+TXT.note+'</p>';
    var m=el.querySelector('.prb-msg'),inp=el.querySelector('input'),msg=function(t){m.textContent=t;};
    el.querySelector('[data-prb="exp"]').onclick=function(){doExport(app,msg);};
    el.querySelector('[data-prb="imp"]').onclick=function(){inp.value='';inp.click();};
    inp.onchange=function(){if(inp.files&&inp.files.length)doImport(inp.files,msg);};
    try{var dn=sessionStorage.getItem('prImportDone');if(dn){sessionStorage.removeItem('prImportDone');var D=JSON.parse(dn);
      msg(TXT.done(D.apps.join(', '),D.n)+(D.bad?' '+TXT.bad(D.bad):''));var dt=el.closest('details');if(dt)dt.open=true;var hs=el.closest('[hidden]');if(hs)hs.hidden=false;if(el.scrollIntoView)setTimeout(function(){el.scrollIntoView({block:'center'});},300);}}catch(e){}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else setTimeout(mount,0);
  return{mount:mount,mergeLog:mergeLog};
})();

function parseFormula(text){

  if(!toks.includes('1')) throw new Error(T.err.root);

  for(const t of toks){
    const m=/^([b♭]*|[#♯]*)(1[0-3]|[1-9])$/.exec(t);
    if(!m) throw new Error(T.err.bad(t));

    const pc=mod(semis,12);
    if(seen.has(pc)) throw new Error(T.err.dup(t));
    seen.add(pc);
    out.push({deg,acc,semis,pc});
  }

  if(!cells.length) return inst;
  const have=new Set(cells.map(([s,f])=>TN.open[s]+f));
  const lo=Math.min(...have),hi=Math.max(...have);
  let added=false;
  for(let q=lo+1;q<hi;q++){
    if(have.has(q)||!ref.pcMap.has(mod(q,12))) continue;
    let best=null;
    for(let s=0;s<6;s++){
      const f=q-TN.open[s]; if(f<0||f>MAXF) continue;
      const d=f<inst.lo?inst.lo-f:(f>inst.hi?f-inst.hi:0);
      if(!best||d<best.d) best={s,f,d};
    }
    if(best){cells.push([best.s,best.f]);have.add(q);added=true;}
  }
  if(!added) return inst;
  const fr=cells.map(c=>c[1]);
  return {lo:Math.min(inst.lo,...fr),hi:Math.max(inst.hi,...fr),cells:new Set(cells.map(([s,f])=>s+':'+f)),rows:inst.rows?rowsOf(cells):null,filled:true};
}
function availableSystems(ref,tuningId){
  const l=[],arp=ref.kind==='arp';
  if(ref.parent!=null&&tuningId==='std') l.push(['caged',T.sys.caged]);
  if(arp) l.push(['nps',T.sys.arp(ref.size)]);
  else if(ref.size===7) l.push(['nps',T.sys.nps3]);
  else if(ref.size===5||ref.size===6) l.push(['nps',T.sys.nps2(ref.size)]);
  l.push(['martino',T.sys.martino]);
  l.push(['window',T.sys.window]);
  l.push(['custom',T.sys.custom]);
  return l;
}
function defaultSystem(list,ref){
  const ids=list.map(x=>x[0]);
  if(ref.size===7&&ref.kind!=='arp'&&ids.includes('nps')) return 'nps';
  if(ids.includes('caged')) return 'caged';
  if(ids.includes('nps')&&ref.kind!=='arp') return 'nps';
  return 'window';
}
function computePositions(sys,ref,TN,S){
  if(sys==='martino')return [];                                   /* Martino-vormen: per A en B apart, zie derive() */
  let raw;
  if(sys==='caged') raw=cagedPositions(ref,TN);
  else if(sys==='nps') raw=npsPositions(ref,TN,ref.size===7&&ref.kind!=='arp'?3:2);
  else if(sys==='window') raw=windowPositions(ref,TN,+S.winSpan||5);
  else{
    let lo=clamp(S.customLo,0,MAXF),hi=clamp(S.customHi,0,MAXF); if(hi<lo){const t=lo;lo=hi;hi=t;}
    return [{n:1,label:T.pos.range(lo,hi),sub:lo+'–'+hi,title:T.pos.custom,instances:[{lo,hi,cells:null}]}];
  }
  raw.forEach(p=>{p.instances=p.instances.map(g=>fillGaps(g,ref,TN));});
  const byNeck=sys==='caged'||S.numbering==='neck';
  raw.sort((a,b)=>byNeck?a.sortKey-b.sortKey:a.degIndex-b.degIndex);
  raw.forEach((p,i)=>{
    p.n=byNeck?i+1:p.degIndex+1;
    const f=p.instances[0], rng=f.lo+'–'+f.hi;
    if(sys==='caged'){p.label=T.pos.caged(p.n,p.shape);p.sub=p.shape+' · '+rng;}
    else{p.label=T.pos.from(p.n,p.startNote.name);p.sub=T.pos.fr(rng);}
    p.title=T.pos.title(p.label,p.instances.map(x=>x.lo+'–'+x.hi).join(T.pos.and));
  });
  return raw;
}

/* ═══════════ 4. STATE + OPSLAG ═══════════ */
let state;
function clone(o){return JSON.parse(JSON.stringify(o));}
function merge(t,o){
  for(const k in o){
    if(!(k in t)) continue;
    const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
    if(isObj(t[k])){ if(isObj(o[k])) merge(t[k],o[k]); }
    else t[k]=o[k];
  }
}
const isHex=v=>typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v);
const oneOf=(v,list,def)=>list.includes(v)?v:def;
function sanitize(s){
  ['A','B'].forEach(k=>{
    const d=DEFAULTS[k],x=s[k];
    if(!ROOTS[x.root]) x.root='C';
    if(x.type!=='custom'&&!SCALES[x.type]) x.type=d.type;
    if(typeof x.formula!=='string') x.formula='';
    x.label=oneOf(x.label,['note','deg','none'],'note');
    x.cmode=oneOf(x.cmode,['fixed','degree'],'fixed');
    if(!isHex(x.color)) x.color=d.color;
    x.on=x.on!==false&&x.on!=='false';
  });
  s.theme=oneOf(s.theme,['auto','light','dark'],'auto');
  const S=s.set,DS=DEFAULTS.set;
  /* eenmalig (deze versie): gedeelde noten weer in de gedeelde kleur; daarna blijft je eigen keuze gewoon bewaard */
  if(!S.sharedV2){S.sharedStyle='own';S.sharedV2=true;}
  SETTINGS.forEach(g=>g.items.forEach(it=>{
    const v=S[it.key],def=DS[it.key];
    if(it.type==='select') S[it.key]=it.options.some(o=>String(o[0])===String(v))?v:def;
    else if(it.type==='range') S[it.key]=(typeof v==='number'||(typeof v==='string'&&v!==''))&&isFinite(+v)?clamp(v,it.min,it.max):def;
    else if(it.type==='check') S[it.key]=typeof v==='boolean'?v:def;
    else if(it.type==='color') S[it.key]=isHex(v)?v:def;
    else if(it.type==='palette') S[it.key]=Array.isArray(v)&&v.length===12&&v.every(isHex)?v:def.slice();
  }));
  S.outside=oneOf(S.outside,['hide','faint'],DS.outside);
  S.chordSize=oneOf(String(S.chordSize),['3','7','9'],DS.chordSize);
  S.xDeg=/^(\d|1[01])$/.test(String(S.xDeg))?String(S.xDeg):DS.xDeg;
  S.xQual=ARPS.some(a=>a.id===S.xQual)?S.xQual:DS.xQual;
  S.customLo=clamp(S.customLo,0,MAXF);S.customHi=clamp(S.customHi,0,MAXF);
  if(isHex(S.colWood)){S.wood='custom';S.woodCustom=S.colWood;}   /* migratie: oude eigen houtkleur wordt "Custom" */
  S.colWood='';
  S.wood=oneOf(S.wood,Object.keys(WOODS).concat('custom'),DS.wood);
  if(!isHex(S.woodCustom)) S.woodCustom=DS.woodCustom;
  if(!Array.isArray(s.pos.selected)) s.pos.selected=[];
  s.pos.selected=s.pos.selected.filter(i=>Number.isInteger(i)&&i>=0);
  s.pos.ref=oneOf(s.pos.ref,['A','B'],'A');
  if(typeof s.pos.system!=='string') s.pos.system='auto';
  const mf=s.pos.mf&&typeof s.pos.mf==='object'?s.pos.mf:{},okF=x=>x&&[1,2,3,4,5].includes(x.f)&&Number.isFinite(+x.mid)?{f:x.f,mid:+x.mid}:null;
  s.pos.mf={A:okF(mf.A),B:okF(mf.B)};
  sanitizeProgs(s);
  return s;
}
function load(){
  const s=clone(DEFAULTS);
  try{const raw=localStorage.getItem(KEY); if(raw) merge(s,JSON.parse(raw));}catch(e){}
  return sanitize(s);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}homeSum();}
/* Samenvatting voor Home (huidige progressie + venster), los bewaard én meegegeven in de Home-link (#pr=…) */
function homeSum(){try{const p=state.progs&&(state.progs.find(x=>x.id===state.view.prog)||state.progs[0]);if(!p)return;
  const lo=state.pv.win===false?3:state.pv.lo,sum={p:{id:p.id,name:p.name},chords:p.sections.flatMap(x=>x.chords).map(c=>({sym:c.sym,root:c.root,type:c.type,bars:c.bars})),lo,hi:lo+state.pv.span-1};
  sum.log=Object.fromEntries(Object.entries(SLOG||{}).sort().slice(-200));
  localStorage.setItem('practiceRoom.scaleSum',JSON.stringify(sum));
  const a=document.getElementById('lnkHome');if(a)a.href=T.links.home+'#pr='+encodeURIComponent(JSON.stringify({scale:sum}));}catch(e){}}

/* ── Houtsoort, gedeeld met de andere tools via 'practiceRoom.board' = {wood, custom} ── */
const WOODS={rosewood:['#3e2518','#24150d'],ebony:['#25201d','#131110'],pauferro:['#6e432a','#4b2c1a'],maple:['#ecd6aa','#d6b47c']};
const SHARED='practiceRoom.board';
const hexRgb=h=>{h=String(h||'').replace('#','');const n=parseInt(h,16);return isNaN(n)||h.length!==6?[122,74,42]:[n>>16&255,n>>8&255,n&255];};
const shade=(h,k)=>'#'+hexRgb(h).map(v=>Math.max(0,Math.min(255,Math.round(v*k))).toString(16).padStart(2,'0')).join('');
function readSharedWood(){try{const s=JSON.parse(localStorage.getItem(SHARED)||'null');if(!s)return false;
  if(WOODS[s.wood]||s.wood==='custom')state.set.wood=s.wood;if(isHex(s.custom))state.set.woodCustom=s.custom;return true;}catch(e){return false;}}
function writeSharedWood(){try{localStorage.setItem(SHARED,JSON.stringify({wood:state.set.wood,custom:state.set.woodCustom}));}catch(e){}}
const woodLight=()=>lum(woodColors()[0])>.3;
function woodColors(){const S=state.set;return WOODS[S.wood]||[S.woodCustom,shade(S.woodCustom,.68)];}
function applyWood(){const c1=woodColors()[0],light=lum(c1)>.3,r=document.documentElement.style;
  const v=light?{'--wfret':'rgba(110,92,64,.38)','--wnut':'#7d7a73','--wstr':'#6f675b','--winl':'rgba(110,92,64,.45)','--guide':'#0a63d6'}
               :{'--wfret':'rgba(205,198,186,.32)','--wnut':'#d9d3c7','--wstr':'#d6cfc1','--winl':'rgba(232,225,210,.32)','--guide':'#64d2ff'};
  v['--wd1']=c1;Object.entries(v).forEach(([k,x])=>r.setProperty(k,x));}

/* ═══════════ 5. DERIVE: state → D ═══════════ */
let D=null;
const lastOk={A:null,B:null};
function derive(){
  if(state.view.mode==='prog'&&curProg()){deriveProg();return;}
  const errs={A:'',B:''};
  const sc={};
  ['A','B'].forEach(k=>{
    if(k==='B'&&!state.B.on){sc.B=null;return;}
    try{sc[k]=makeScale(state[k]);lastOk[k]=sc[k];}
    catch(e){errs[k]=e.message;sc[k]=lastOk[k]||buildScale(state[k].root,entriesOf(SCALES.major),{name:SCALES.major.name,parent:0});}
  });
  const TN=TUNINGS[state.set.tuning]||TUNINGS.std;
  const showA=state.A.on!==false,showB=!!sc.B;
  const refKey=((state.pos.ref==='B'||!showA)&&sc.B)?'B':'A';
  const ref=sc[refKey];
  const sysList=availableSystems(ref,state.set.tuning);
  let sys=state.pos.system;
  if(sys==='auto'||!sysList.some(x=>x[0]===sys)) sys=defaultSystem(sysList,ref);
  const positions=computePositions(sys,ref,TN,state.set);
  let sel=state.pos.selected.filter(i=>Number.isInteger(i)&&i>=0&&i<positions.length);
  if(sys==='custom') sel=[0];
  D={A:sc.A,B:sc.B,showA,showB,cmp:showA&&showB,tuning:TN,refKey,ref,sysList,sys,positions,sel,errs,stats:{AB:0,A:0,B:0}};
  /* Martino-vormen in Compare A/B: A en B krijgen elk hun eigen mineurvormen (via de mineurconversie van de toonladder);
     je kiest per kant een vorm op de vormenkaart, ze worden over elkaar gelegd. Geen keuze = die kant over de hele hals. */
  if(sys==='martino'){const mf=state.pos.mf;D.fmRows=[];D.shapeRings=[];
    ['A','B'].forEach(k=>{if(!sc[k]||(k==='A'&&!showA))return;const pc=mRootPcScale(sc[k]),P=formPlaces(pc,TN),pin=mf[k];
      let cur=null;if(pin){const l=P.filter(p=>p.f===pin.f);if(l.length)cur=l.reduce((a,b)=>Math.abs(b.mid-pin.mid)<Math.abs(a.mid-pin.mid)?b:a);}
      D.fmRows.push({key:k,name:mNameScale(sc[k]),sub:scaleTitle(sc[k]),pc,cur});
      if(cur){D.positions.push({n:cur.f,label:'',sub:'',instances:[{lo:cur.lo,hi:cur.hi,cells:null,rows:cur.rows,key:k}]});D.sel.push(D.positions.length-1);D.shapeRings.push(...cur.shape);}});}
}
/* mineurconversie voor een toonladder: grote terts + kleine septiem → vanaf 5; grote terts → vanaf 6;
   kleine terts + ♭5 zonder reine kwint → vanaf ♭3; anders mineur vanaf de grondtoon */
function mRuleScale(sc){const iv=new Set(sc.notes.map(n=>n.iv));
  if(iv.has(4))return iv.has(10)?7:9;if(iv.has(3))return iv.has(6)&&!iv.has(7)?3:0;return 0;}
const mRootPcScale=sc=>mod(sc.root.pc+mRuleScale(sc),12);
const mNameScale=sc=>{const pc=mRootPcScale(sc),n=sc.pcMap.get(pc);return(n?n.name:ROOTS[PC_FLAT[pc]].name)+'m';};

/* ═══════════ 6. RENDER ═══════════ */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lum(h){const c=hexRGB(h).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
function hexRGB(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return [(n>>16)&255,(n>>8)&255,n&255];}
function textOn(h){const L=lum(h);return (L+0.05)/0.05>1.05/(L+0.05)?'#141210':'#ffffff';}
function colorOf(k,n){return state[k].cmode==='degree'?state.set.palette[n.iv]:state[k].color;}
function labOf(k,n){const m=D&&D.lab?D.lab:state[k].label;return m==='note'?n.name:(m==='deg'?n.label:'');}
function fsz(t,r){const n=[...t].length;return r*(n<=1?1.02:n===2?0.92:n===3?0.74:0.6);}

/* geometrie van het bord (SVG-eenheden). X0 = de kam; links daarvan alleen snaarnamen en open snaren, zonder hout. */
const G={X0:70,W:1300,TOP:34,GAP:44,PAD:22,VBW:1390,VBH:350};

function dotG(o){
  const {cx,cy,r,fill,fill2,tc,l1,l2,ring,title,pc,cls,sq}=o;
  let s='<g class="n'+(cls?' '+cls:'')+'" data-pc="'+pc+'"><title>'+esc(title)+'</title>';
  if(sq){
    const h=r*0.9,R=h+3.4;
    if(ring&&ring.length) s+='<rect x="'+(cx-R)+'" y="'+(cy-R)+'" width="'+2*R+'" height="'+2*R+'" rx="'+R*0.4+'" fill="none" stroke="'+ring[ring.length-1]+'" stroke-width="2.2"/>';
    s+='<rect class="core" x="'+(cx-h)+'" y="'+(cy-h)+'" width="'+2*h+'" height="'+2*h+'" rx="'+h*0.32+'" fill="'+fill+'"/>';
    if(l1) s+='<text x="'+cx+'" y="'+cy+'" dy=".35em" text-anchor="middle" font-size="'+fsz(l1,r)+'" fill="'+tc+'">'+esc(l1)+'</text>';
    return s+'</g>';
  }
  if(ring&&ring.length){
    const R=r+3.4,C=2*Math.PI*R;
    if(ring.length===1) s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+ring[0]+'" stroke-width="2.2"/>';
    else s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+ring[0]+'" stroke-width="2.2" stroke-dasharray="'+C/2+' '+C/2+'"/>'
          +'<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+ring[1]+'" stroke-width="2.2" stroke-dasharray="'+C/2+' '+C/2+'" stroke-dashoffset="'+C/2+'"/>';
  }
  if(fill2){
    s+='<path class="core" d="M'+cx+' '+(cy-r)+'A'+r+' '+r+' 0 0 0 '+cx+' '+(cy+r)+'Z" fill="'+fill+'"/>'
      +'<path class="core" d="M'+cx+' '+(cy-r)+'A'+r+' '+r+' 0 0 1 '+cx+' '+(cy+r)+'Z" fill="'+fill2+'"/>';
  }else s+='<circle class="core" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+fill+'"/>';
  const halo=fill2?' stroke="rgba(0,0,0,.6)" stroke-width="2.4" paint-order="stroke" stroke-linejoin="round"':'';
  if(l1&&l2){
    const f=r*0.6;
    s+='<text x="'+cx+'" y="'+(cy-r*0.36)+'" dy=".35em" text-anchor="middle" font-size="'+f+'" fill="'+tc+'"'+halo+'>'+esc(l1)+'</text>'
      +'<text x="'+cx+'" y="'+(cy+r*0.42)+'" dy=".35em" text-anchor="middle" font-size="'+f+'" fill="'+tc+'"'+halo+'>'+esc(l2)+'</text>';
  }else if(l1){
    s+='<text x="'+cx+'" y="'+cy+'" dy=".35em" text-anchor="middle" font-size="'+fsz(l1,r)+'" fill="'+tc+'"'+halo+'>'+esc(l1)+'</text>';
  }
  return s+'</g>';
}

function renderBoard(){
  const S=state.set,TN=D.tuning,r=+S.dotSize,sp=S.fretSpacing;
  const fx=n=>G.X0+(sp==='equal'?G.W*n/MAXF:G.W*(1-Math.pow(2,-n/12))/(1-Math.pow(2,-MAXF/12)));
  const cxF=n=>n===0?G.X0-26:(fx(n-1)+fx(n))/2;
  const cyS=s=>G.TOP+G.PAD+(5-s)*G.GAP;
  const yTop=G.TOP,yBot=G.TOP+2*G.PAD+5*G.GAP,xEnd=G.X0+G.W+18,R=9;
  const regs=D.sel.length?D.sel.flatMap(i=>D.positions[i].instances):null;
  const vis=(X,s,f)=>{
    if(!regs) return true;
    if(regs.some(g=>g.key)&&!regs.some(g=>g.key===X)) return true;   /* Martino: voor deze kant geen vorm gekozen */
    const isRef=X===D.refKey;
    return regs.some(g=>{
      if(g.key){if(g.key!==X)return false;return !!g.rows[s]&&f>=g.rows[s][0]&&f<=g.rows[s][1];}   /* Martino-vorm van A of B */
      if(isRef) return g.cells?g.cells.has(s+':'+f):(f>=g.lo&&f<=g.hi);
      if(g.rows) return !!g.rows[s]&&f>=g.rows[s][0]&&f<=g.rows[s][1];
      return f>=g.lo&&f<=g.hi;
    });
  };
  let vb='0 0 '+G.VBW+' '+G.VBH;
  const wholeF=!!(D.prog&&D.fA&&!state.pv.fzoom);       /* Martino-vormen over de hele hals (niet inzoomen) */
  if(D.prog&&regs&&!wholeF){                                    /* progressie met venster: inzoomen rond de positie */
    const lo=Math.min(...regs.map(z=>z.lo)),hi=Math.max(...regs.map(z=>z.hi)),left=lo<=0?G.X0-50:fx(lo-1),right=fx(Math.min(hi,MAXF)),
      c=(left+right)/2,vw=Math.min(G.VBW,Math.max(780,right-left+140));   /* breed genoeg voor twee vormen */
    vb=Math.max(0,Math.min(G.VBW-vw,c-vw/2)).toFixed(1)+' 0 '+vw+' '+G.VBH;}
  $('#board').classList.toggle('zoom',!!(D.prog&&regs&&!wholeF));
  let o='<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+esc(T.board.aria)+'">';
  /* effen hout vanaf de kam, afgeronde hoeken alleen aan het eind */
  o+='<path class="bwood" d="M'+G.X0+' '+yTop+'H'+(xEnd-R)+'Q'+xEnd+' '+yTop+' '+xEnd+' '+(yTop+R)+'V'+(yBot-R)+'Q'+xEnd+' '+yBot+' '+(xEnd-R)+' '+yBot+'H'+G.X0+'Z"/>';
  if(S.inlays){
    const cyM=(cyS(2)+cyS(3))/2,c1=(cyS(1)+cyS(2))/2,c2=(cyS(4)+cyS(3))/2;
    [3,5,7,9,15,17,19,21].forEach(n=>{o+='<circle class="inl" cx="'+cxF(n)+'" cy="'+cyM+'" r="6.5"/>';});
    o+='<circle class="inl" cx="'+cxF(12)+'" cy="'+c1+'" r="6.5"/><circle class="inl" cx="'+cxF(12)+'" cy="'+c2+'" r="6.5"/>';
  }
  for(let n=1;n<=MAXF;n++) o+='<line class="wire" x1="'+fx(n)+'" y1="'+yTop+'" x2="'+fx(n)+'" y2="'+yBot+'" stroke-width="4"/>';
  o+='<rect class="nutr" x="'+(G.X0-6)+'" y="'+yTop+'" width="7" height="'+(yBot-yTop)+'"/>';
  D.bands=[];
  if(regs){
    D.sel.forEach(i=>D.positions[i].instances.forEach(g=>{
      const x1=g.lo<=0?G.X0-50:fx(g.lo-1)+1.5,x2=fx(Math.min(g.hi,MAXF))-1.5;
      D.bands.push([x1,x2]);
      const kc=g.key?' style="--bc:'+state[g.key].color+'"':'';
      o+='<rect class="band'+(g.key?' bk':'')+'" x="'+x1+'" y="'+(yTop-8)+'" width="'+Math.max(6,x2-x1)+'" height="'+(yBot-yTop+16)+'" rx="10"'+kc+'/>'
        +(g.key?'<text class="bandl bk" x="'+(g.key==='A'?x1+8:x2-8)+'" y="'+(yTop-13)+'" style="--bc:'+state[g.key].color+';text-anchor:'+(g.key==='A'?'start':'end')+'">'+g.key+' · '+PT.formN(D.positions[i].n)+'</text>'   /* A links, B rechts */
          :'<text class="bandl" x="'+((x1+x2)/2)+'" y="'+(yTop-13)+'">'+(D.sys==='custom'?'':(D.sys==='forms'?PT.formN(D.positions[i].n):D.positions[i].n))+'</text>');
    }));
  }
  for(let s=0;s<6;s++){
    const w=(3.2-s*0.42).toFixed(2);
    o+='<line class="stro" x1="'+(G.X0-50)+'" y1="'+cyS(s)+'" x2="'+(G.X0-6)+'" y2="'+cyS(s)+'" stroke-width="'+w+'"/>'
      +'<line class="strl" x1="'+G.X0+'" y1="'+cyS(s)+'" x2="'+xEnd+'" y2="'+cyS(s)+'" stroke-width="'+w+'"/>';
    if(S.stringNames) o+='<text class="snm" x="14" y="'+(cyS(s)+4)+'">'+esc(TN.names[s])+'</text>';
  }
  if(S.fretNums!=='off'){
    const marks=[3,5,7,9,12,15,17,19,21];
    for(let n=1;n<=MAXF;n++){
      const k=marks.includes(n); if(S.fretNums==='marks'&&!k) continue;
      o+='<text class="fnum'+(k?' k':'')+'" x="'+cxF(n)+'" y="'+(yBot+22)+'">'+n+'</text>';
    }
  }
  if(D.prog&&!D.pcmp){o+=progDots(TN,r,cxF,cyS,regs)+'</svg>';$('#board').innerHTML=o;return;}
  /* noten */
  const back=[],front=[];
  const st={AB:0,A:0,B:0},foc=S.cmpFocus,cmp=D.cmp;
  for(let s=0;s<6;s++)for(let f=0;f<=MAXF;f++){
    const pc=mod(TN.open[s]+f,12);
    const a=D.showA?D.A.pcMap.get(pc):null,b=D.B?D.B.pcMap.get(pc):null;
    if(!a&&!b) continue;
    const visible=!!((a&&vis('A',s,f))||(b&&vis('B',s,f)));
    if(!visible&&S.outside!=='faint'&&!wholeF) continue;               /* hele hals: noten buiten de vorm vaag */
    const cls=a&&b?'AB':(a?'A':'B');
    const dim=cmp&&((foc==='diff'&&cls==='AB')||(foc==='same'&&cls!=='AB'));
    let fill,fill2=null;
    if(cls==='A') fill=colorOf('A',a);
    else if(cls==='B') fill=colorOf('B',b);
    else if(S.sharedStyle==='split'){fill=colorOf('A',a);fill2=colorOf('B',b);}
    else fill=S.colShared;
    const la=a?labOf('A',a):'',lb=b?labOf('B',b):'';
    let l1,l2='';
    if(cls==='A') l1=la; else if(cls==='B') l1=lb;
    else if(S.sharedLabel==='B') l1=lb||la;
    else{l1=la||lb;if(S.sharedLabel==='both'&&la&&lb&&la!==lb){l1=la;l2=lb;}}
    const ring=[];
    if(a&&a.iv===0&&(state.A.cmode==='fixed'||cmp)) ring.push(state.A.color);
    if(b&&b.iv===0&&(state.B.cmode==='fixed'||cmp)) ring.push(state.B.color);
    const parts=[];
    if(a) parts.push('A: '+a.name+' ('+a.label+')');
    if(b) parts.push('B: '+b.name+' ('+b.label+')');
    const title=T.board.dot(6-s,TN.names[s],f,parts.join(' · '));
    const cx=cxF(f),cy=cyS(s),sq=cls==='B'&&cmp&&S.shapeB;
    if(!visible||dim){
      back.push(dotG({cx,cy,r:r*0.5,fill,fill2,tc:'#fff',l1:'',l2:'',ring:null,title,pc,cls:visible?'dim':'faint',sq}));
      continue;
    }
    st[cls]++;
    front.push(dotG({cx,cy,r,fill,fill2,tc:fill2?'#fff':textOn(fill),l1,l2,ring:ring.length?ring:null,title,pc,cls:'',sq}));
  }
  const rings=(D.shapeRings||[]).filter(([s,f])=>f>=0&&f<=MAXF).map(([s,f])=>'<circle class="shp on" cx="'+cxF(f)+'" cy="'+cyS(s)+'" r="'+(r+6)+'"/>').join('');   /* m7-grepen van de vormen */
  o+=back.join('')+front.join('')+rings+'</svg>';
  D.stats=st;
  $('#board').innerHTML=o;
}

/* Smal scherm: na het kiezen van een positie die positie in beeld schuiven (alleen als de keuze verandert). */
let lastSelKey=null;
function scrollToSel(){
  const key=D.sys+'|'+D.sel.join(',')+'|'+D.refKey+'|'+(D.bands[0]||[]).join(',');
  if(key===lastSelKey) return;
  lastSelKey=key;
  const w=$('.bwrap'),svg=$('#board svg');
  if(!D.bands.length||!svg||w.scrollWidth<=w.clientWidth+1) return;
  const k=svg.getBoundingClientRect().width/G.VBW,[x1,x2]=D.bands[0];
  const left=Math.max(0,((x1+x2)/2)*k-w.clientWidth/2);
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  w.scrollTo({left,behavior:reduce?'auto':'smooth'});
}

function renderCompare(){
  const card=$('#cardCmp'),C=T.cmp;
  if(!D.cmp||(D.prog&&!D.pcmp)){card.hidden=true;return;}
  card.hidden=false;$('#hCmp').textContent=D.pcmp?D.ch.sym+' → '+D.ch2.sym:T.ui.compareTitle;
  const A=D.A,B=D.B,cA=state.A.color,cB=state.B.color,cS=state.set.colShared;
  const both=[],onlyA=[],onlyB=[];
  for(let pc=0;pc<12;pc++){const a=A.pcMap.get(pc),b=B.pcMap.get(pc);if(a&&b)both.push([a,b]);else if(a)onlyA.push(a);else if(b)onlyB.push(b);}
  const dotI=c=>'<i style="background:'+c+'"></i>';
  const scope=D.sel.length?C.scope(D.stats.AB,D.stats.A,D.stats.B):'';
  $('#cmpSum').innerHTML='<span>'+dotI(cS)+'<b>'+both.length+'</b> '+C.common+'</span><span>'+dotI(cA)+'<b>'+onlyA.length+'</b> '+C.onlyA+'</span><span>'+dotI(cB)+'<b>'+onlyB.length+'</b> '+C.onlyB+'</span>'
    +(scope?'<span style="color:var(--mut)">'+esc(scope)+'</span>':'');
  const base=A.root.pc;
  let h='<span></span>';
  for(let k=0;k<12;k++) h+='<span class="h">'+INT_LBL[k]+'</span>';
  const row=(lbl,sc,c)=>{
    let r='<span class="l">'+lbl+'</span>';
    for(let k=0;k<12;k++){const n=sc.pcMap.get(mod(base+k,12));
      r+=n?'<span class="cc on" style="--c:'+c+';--ct:'+textOn(c)+'" title="'+esc(lbl+': '+n.name+' = '+C.deg+' '+n.label)+'">'+esc(n.name)+'<small>'+esc(n.label)+'</small></span>':'<span class="cc"></span>';}
    return r;
  };
  h+=row('A',A,cA)+row('B',B,cB);
  h+='<span class="l" style="font-weight:500;color:var(--mut)">'+esc(C.match)+'</span>';
  for(let k=0;k<12;k++){
    const pc=mod(base+k,12),a=A.pcMap.has(pc),b=B.pcMap.has(pc);
    const c=a&&b?cS:(a?cA:(b?cB:''));
    h+='<span class="cc res'+(c?' x':'')+'"'+(c?' style="--c:'+c+'"':'')+'></span>';
  }
  $('#cmpStrip').innerHTML=h;
  const tag=(t,c)=>'<span class="tag" style="--c:'+c+';--ct:'+textOn(c)+'">'+esc(t)+'</span>';
  const none='<span class="tag plain">'+esc(C.none)+'</span>';
  const bothTxt=both.map(([a,b])=>tag(a.name+(a.name!==b.name?' ('+b.name+')':'')+' · A: '+a.label+' = B: '+b.label,cS)).join('')||none;
  const aTxt=onlyA.map(n=>tag(n.name+' · A: '+n.label,cA)).join('')||none;
  const bTxt=onlyB.map(n=>tag(n.name+' · B: '+n.label,cB)).join('')||none;
  const used=new Set(),shifts=[];
  onlyA.forEach(a=>{
    let best=null;
    onlyB.forEach(b=>{
      if(used.has(b.pc)) return;
      const d=mod(b.pc-a.pc+6,12)-6;
      if(Math.abs(d)===1&&(!best||Math.abs(d)<Math.abs(best.d))) best={b,d};
    });
    if(best){used.add(best.b.pc);shifts.push(a.name+' ('+a.label+') → '+best.b.name+' ('+best.b.label+') '+(best.d>0?'+1':'−1'));}
  });
  $('#cmpLists').innerHTML=
    '<div class="li"><b>'+esc(C.hCommon)+'</b>'+bothTxt+'</div>'
   +'<div class="li"><b>'+esc(C.hA)+'</b>'+aTxt+'</div>'
   +'<div class="li"><b>'+esc(C.hB)+'</b>'+bTxt+'</div>'
   +(shifts.length?'<div class="li"><b>'+esc(C.hShift)+'</b>'+shifts.map(t=>'<span class="tag plain">'+esc(t)+'</span>').join('')+'</div>':'');
}

/* ── Akkoorden van A → B ──
   Diatonisch: stapel tertsen op elke graad van A en herken het resultaat in de arpeggio-groepen van REGISTRY. */
const ROMAN=['I','II','III','IV','V','VI','VII'];
const ARPS=REGISTRY.filter(g=>g.kind==='arp').flatMap(g=>g.items);
const symOf=it=>it?(it.sym!=null?it.sym:it.name):'';
function romanSuffix(sym){
  if(/^m7♭5/.test(sym)) return 'ø7'+sym.slice(4);
  if(/^m9♭5/.test(sym)) return 'ø9'+sym.slice(4);
  if(/^dim7/.test(sym)) return '°7'+sym.slice(4);
  if(sym==='dim') return '°';
  if(sym==='aug') return '+';
  return /^m(?!aj)/.test(sym)?sym.slice(1):sym;
}
const isMinorF=f=>/(^| )b3( |$)/.test(f);
function chordFor(sc,i,size){
  const N=sc.notes,r=N[i],iv=k=>mod(N[(i+k)%7].pc-r.pc,12);
  const th={3:'b3',4:'3'}[iv(2)],fi={6:'b5',7:'5',8:'#5'}[iv(4)],se={9:'bb7',10:'b7',11:'7'}[iv(6)],ni={1:'b9',2:'9',3:'#9'}[iv(1)];
  if(!th||!fi||(size!=='3'&&!se)||(size==='9'&&!ni)) return null;
  const f3='1 '+th+' '+fi,f7=f3+' '+se,formula=size==='3'?f3:(size==='7'?f7:f7+' '+ni);
  const it=ARPS.find(x=>x.f===formula),id=it?it.id:null;
  let sym=symOf(it);
  if(!it){
    const it7=ARPS.find(x=>x.f===f7);
    sym=it7?symOf(it7)+'('+accStr(ni[0]==='b'?-1:ni[0]==='#'?1:0)+'9)':'?';
  }
  const l=(sc.root.letter+r.degNum-1)%7;
  const rootId=rootIdOf(l,mod(r.pc-LPC[l]+6,12)-6,r.pc);
  const num=ROMAN[(r.degNum-1)%7]||'?';
  const pre=r.label.replace(/\d+$/,'');
  return {id,formula,rootId,name:r.name+sym,roman:pre+(th==='b3'?num.toLowerCase():num)+romanSuffix(sym)};
}
function renderDiatonic(){
  const host=$('#dchips'),sc=D.A,size=state.set.chordSize;
  document.querySelectorAll('#diat [data-cs]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cs===size));
  if(sc.size!==7||sc.kind==='arp'){host.innerHTML='<p class="dnote">'+esc(T.diatNote)+'</p>';return;}
  host.innerHTML=sc.notes.map((n,i)=>{
    const c=chordFor(sc,i,size);
    if(!c) return '<button type="button" class="dc" disabled><b>'+ROMAN[i]+'</b><small>—</small></button>';
    const on=state.B.on&&state.B.root===c.rootId&&(state.B.type==='custom'?state.B.formula===c.formula:state.B.type===c.id);
    return '<button type="button" class="dc" data-i="'+i+'" aria-pressed="'+on+'" title="'+esc(c.name+' · '+c.formula)+'"><b>'+esc(c.roman)+'</b><small>'+esc(c.name)+'</small></button>';
  }).join('');
}
/* Niet-diatonische akkoorden: elke chromatische graad van A + elk akkoordtype uit REGISTRY. */
const CHROM=[['',0],['♭',1],['',1],['♭',2],['',2],['',3],['♭',4],['',4],['♭',5],['',5],['♭',6],['',6]];
function arpItem(id){return ARPS.find(x=>x.id===id)||ARPS[0];}
function xChord(semis,id){
  const A=D.A,it=arpItem(id),sym=symOf(it);
  const pc=mod(A.root.pc+semis,12),[acc,ni]=CHROM[semis],l=(A.root.letter+ni)%7;
  const ac=mod(pc-LPC[l]+6,12)-6,name=LETTERS[l]+accStr(ac),rootId=rootIdOf(l,ac,pc);
  const num=ROMAN[ni];
  return {id:it.id,rootId,name:name+sym,roman:acc+(isMinorF(it.f)?num.toLowerCase():num)+romanSuffix(sym)};
}

/* nieuwe voorkeur: akkoorden van die soort die nog op de voorgestelde toonladder staan, schuiven mee;
   toonladders die je zelf per akkoord koos (of met "Start on") blijven staan */
function setScalePref(type,val){const todo=[];
  state.progs.forEach(p=>{const ks=sectionKeys(p.sections.map(x=>x.chords));
    p.sections.forEach((sec,si)=>sec.chords.forEach(c=>{if(c.type===type&&!c.soff&&c.scale===suggestScales(c,ks[si])[0])todo.push([c,ks[si]]);}));});
  if(val)SPREF[type]=val;else delete SPREF[type];
  try{localStorage.setItem('toonladderTrainer:scalePref',JSON.stringify(SPREF));}catch(e){}
  todo.forEach(([c,k])=>{c.scale=suggestScales(c,k)[0]||c.scale;});
  update();}

/* ── Afspelen (Web Audio): toonladder of akkoordtonen omhoog, optioneel weer omlaag ── */
const ICON_PLAY='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_STOP='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
let actx=null,playTimers=[],playing=null,playBus=null;
function syncPlayBtns(){['A','B'].forEach(k=>{const b=$('#play'+k),l=playing===k?T.row.stop(k):T.row.play(k);b.innerHTML=playing===k?ICON_STOP:ICON_PLAY;b.setAttribute('aria-pressed',playing===k);b.setAttribute('aria-label',l);b.title=l;b.disabled=(k==='A'?state.A.on===false:!state.B.on);});}
function stopPlay(){
  playTimers.forEach(clearTimeout);playTimers=[];
  if(playBus){const b=playBus;playBus=null;
    try{b.gain.cancelScheduledValues(actx.currentTime);b.gain.setTargetAtTime(0,actx.currentTime,0.015);setTimeout(()=>{try{b.disconnect();}catch(e){}},150);}catch(e){}}
  document.querySelectorAll('.nc.playing').forEach(e=>e.classList.remove('playing'));
  playing=null;syncPlayBtns();
}
function pluck(f,t,d,out){
  const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain(),lp=actx.createBiquadFilter(),g2=actx.createGain();
  o.type='sawtooth';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2;g2.gain.value=0.5;
  lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(f*9,9000),t);lp.frequency.exponentialRampToValueAtTime(f*1.6,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(out);
  o.start(t);o2.start(t);o.stop(t+d+0.05);o2.stop(t+d+0.05);
}
function playScale(k,over){
  if(playing===k){stopPlay();return;}
  stopPlay();
  const sc=over||D[k];if(!sc||(!over&&k==='A'&&!D.showA)) return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC) return;
  try{actx=actx||new AC();if(actx.state==='suspended')actx.resume();}catch(e){return;}
  const ord=sc.notes.slice().sort((a,b)=>a.semis-b.semis);
  const base=52+mod(sc.root.pc-4,12);
  const top=base+12*(Math.floor(ord[ord.length-1].semis/12)+1);
  let seq=ord.map(n=>({pc:n.pc,m:base+n.semis}));
  seq.push({pc:sc.root.pc,m:top});
  if(state.set.playMode==='updown') seq=seq.concat(seq.slice(0,-1).reverse());
  const step=60/clamp(state.set.tempo,40,240)/2,t0=actx.currentTime+0.06;
  playing=k;syncPlayBtns();
  playBus=actx.createGain();playBus.gain.value=1;playBus.connect(actx.destination);
  const bus=playBus;
  seq.forEach((q,i)=>{
    pluck(440*Math.pow(2,(q.m-69)/12),t0+i*step,step*2.2,bus);
    playTimers.push(setTimeout(()=>{
      document.querySelectorAll('#notes'+k+' .nc.playing').forEach(e=>e.classList.remove('playing'));
      const c=document.querySelector('#notes'+k+' .nc[data-pc="'+q.pc+'"]');if(c)c.classList.add('playing');
    },(0.06+i*step)*1000));
  });
  playTimers.push(setTimeout(()=>{if(playBus===bus)playBus=null;stopPlay();setTimeout(()=>{try{bus.disconnect();}catch(e){}},step*3000);},(0.06+seq.length*step+0.3)*1000));
}


/* ═══════════ 8. PROGRESSIES ═══════════
   Een progressie = {id, name, tempo, sections:[{chords:[{sym, root, type, bars, bass, scale}]}]}.
   type = arpeggio-id uit REGISTRY (het akkoord), scale = toonladder-id die je over dat akkoord speelt (grondtoon = grondtoon akkoord).
   Op het bord: B = akkoordtonen, A = toonladder; de positie (fretvenster) blijft staan als je van akkoord wisselt.
   Invoer: tekst als "Dm7b5 G7b9 Cm7(2) | Ebm7 Ab7 Dbmaj7" → parseText(); '|' begint een nieuwe sectie, (2) = twee maten. */
const PT=T.prog,TS=T.sheet;
const CT='#ff9f0a',ST='#efe8da';                       /* kleur akkoordtoon / toonladdertoon */
const BARS=[0.5,1,2,3,4];
const SYMID={};ARPS.forEach(a=>{SYMID[a.sym.replace(/[()]/g,'')]=a.id;});
const symOfId=id=>symOf(arpItem(id));
const newId=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const secLabel=i=>String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):'');
/* akkoordfamilie, voor toonsoort, trap en suggesties */
function famOf(id){const s=symOfId(id);
  if(/^m[79]♭5/.test(s))return 'hd';
  if(/^dim/.test(s))return 'dim';
  if(/^m\(maj/.test(s))return 'mM';
  if(/^m(?!aj)/.test(s))return 'min';
  if(/^aug|^maj[79]♯5/.test(s))return 'aug';
  if(/sus/.test(s))return /^[79]/.test(s)?'dom':'sus';
  if(s===''||/^maj|^6|^add9/.test(s))return 'maj';
  return 'dom';}
/* akkoordsymbool achter de grondtoon → vaste schrijfwijze (Δ7, -7, ø, °7, alt, b9 … worden herkend) */
function normQ(q){
  q=q.replace(/\s+/g,'').replace(/[()]/g,'').replace(/b/g,'♭').replace(/#/g,'♯');
  q=q.replace(/^(min|mi|-)/,'m');
  q=q.replace(/^(Maj|MAJ|maj|Ma|ma|M|Δ|△)/,'maj');
  q=q.replace(/^m(M|Maj|maj|Δ|△)/,'mmaj');
  q=q.replace(/^(ø|Ø)7?/,'m7♭5');
  q=q.replace(/^(°|o)7/,'dim7').replace(/^(°|o)$/,'dim');
  q=q.replace(/^(\+|aug)7/,'7♯5').replace(/^7\+$/,'7♯5');
  if(q==='+')q='aug';
  q=q.replace(/-(?=\d)/g,'♭').replace(/\+(?=\d)/g,'♯');
  if(q==='maj')q='';
  if(q==='alt')q='7alt';
  if(q==='69')q='6/9';if(q==='m69')q='m6/9';
  if(q==='sus')q='sus4';if(q==='7sus')q='7sus4';if(q==='9sus')q='9sus4';
  if(q==='maj♯11')q='maj7♯11';
  return q;}
function parseBars(x){if(x==='½'||x==='1/2'||x==='.5'||x==='0.5')return .5;const n=+x;return BARS.includes(n)?n:Math.min(4,Math.max(1,Math.round(n)||1));}
const barsTxt=b=>b===1?'':'('+(b===.5?'½':b)+')';
function parseChord(tok){
  let t=String(tok).trim(),bars=1;const raw=t;
  const bm=/(?:\((½|1\/2|0?\.5|\d)\)|[:*](½|1\/2|0?\.5|\d))$/.exec(t);
  if(bm){bars=parseBars(bm[1]||bm[2]);t=t.slice(0,bm.index);}
  let bass='';const sl=/\/([A-G])([#♯b♭]?)$/.exec(t);
  if(sl){bass=sl[1]+(/[#♯]/.test(sl[2])?'♯':sl[2]?'♭':'');t=t.slice(0,sl.index);}
  const m=/^([A-G])([#♯b♭]?)(.*)$/.exec(t);

const SHAPE_C='#e5484d';
const MDEG=['1','♭2','2','♭3','3','4','♭5','5','♭6','6','♭7','7'];               /* graden vanaf de mineurgrondtoon */                                          /* rood, zoals de greep in de PDF */
function progDots(TN,r,cxF,cyS,regs){
  if(!D.ch)return'';
  const A=D.A,B=D.B,cr=ROOTS[D.ch.root].pc,civ=new Set(D.Bfull.notes.map(n=>n.iv)),S=state.set,pv=state.pv;
  const tl=iv=>({0:'1',1:'♭9',2:'9',3:civ.has(4)?'♯9':'♭3',4:'3',5:'11',6:civ.has(7)?'♯11':'♭5',7:'5',8:civ.has(4)&&!civ.has(7)&&!civ.has(6)?'♯5':'♭13',9:civ.has(10)||civ.has(11)?'13':'6',10:'♭7',11:'7'})[iv];
  const ringC=woodLight()?'#1c1c1e':'#ffffff',back=[],front=[],gd=[];
  for(let s=0;s<6;s++)for(let f=0;f<=MAXF;f++){
    const pc=mod(TN.open[s]+f,12),inS=A&&A.pcMap.get(pc),inC=B&&B.pcMap.get(pc),cx=cxF(f),cy=cyS(s);
    const visible=!regs||regs.some(z=>z.rows?(!!z.rows[s]&&f>=z.rows[s][0]&&f<=z.rows[s][1]):(f>=z.lo&&f<=z.hi)),g=D.guide&&D.guide.has(pc)&&visible;
    const shp=!!D.fshape&&D.fshape.has(s+':'+f);                    /* noot van de m7-greep van de Martino-vorm */
    if(!inS&&!inC){
      if(shp)gd.push('<circle class="shp" cx="'+cx+'" cy="'+cy+'" r="'+(r*.75)+'"/>');
      if(g)gd.push('<g class="n" data-pc="'+pc+'"><title>'+esc(PT.legGuide+': '+D.guide.get(pc))+'</title><circle class="gd" cx="'+cx+'" cy="'+cy+'" r="'+(r*.9)+'"/><text class="gdt" x="'+cx+'" y="'+cy+'" dy=".35em" text-anchor="middle" font-size="'+fsz(D.guide.get(pc),r*.9)+'">'+esc(D.guide.get(pc))+'</text></g>');
      continue;}
    if(!visible&&S.outside!=='faint'&&!(D.fA&&!pv.fzoom))continue;    /* vormen over de hele hals: rest vaag tonen */
    const iv=mod(pc-cr,12),deg=inC?inC.label:tl(iv),
      lab=pv.labels==='deg'?deg:pv.labels==='sdeg'?(inS?inS.label:deg):pv.labels==='mdeg'?(D.fA?MDEG[mod(iv-mOff(D.ch),12)]:deg):(inS?inS.name:inC.name);
    const fill=inC?CT:ST,sq=!!inC&&!inS&&!!A,title=PT.dot(6-s,TN.names[s],f,(inS||inC).name+' ('+deg+')');
    if(!visible){back.push(dotG({cx,cy,r:r*.5,fill,tc:'#1c1c1e',l1:'',title,pc,cls:'faint',sq}));continue;}
    const rg=[];if(inC&&iv===0)rg.push(ringC);if(shp)rg.push(SHAPE_C);
    front.push(dotG({cx,cy,r:inC?r:r*.9,fill,tc:'#1c1c1e',l1:lab,title,pc,cls:'',sq,ring:rg.length?rg:null}));
    if(g)gd.push('<circle class="gd" cx="'+cx+'" cy="'+cy+'" r="'+(r+6.5)+'"/>');
  }
  return back.join('')+front.join('')+gd.join('');}

function selectChord(i){if(progPlayer.on){progPlayer.seek=geom(curProg()).starts[i]||0;state.view.sel=i;state.view.cmp=null;update();return;}
  progStop();state.view.sel=i;state.view.cmp=null;update();}

function openProg(id){progStop();if(state.view.prog!==id)state.view.sel=0;state.view.mode='prog';state.view.prog=id;delArmed=null;update();}
function locate(fi){const l=flat(curProg());return l[fi]||null;}
function moveChord(fi,toSi,toCi){
  const p=curProg(),at=locate(fi);if(!at)return;
  const c=p.sections[at.si].chords.splice(at.ci,1)[0];
  if(at.si===toSi&&toCi>at.ci)toCi--;
  p.sections[toSi].chords.splice(Math.max(0,Math.min(toCi,p.sections[toSi].chords.length)),0,c);
  state.view.sel=flat(p).findIndex(x=>x.c===c);update();}
function moveBy(d){
  const p=curProg(),at=locate(D.idx);if(!at)return;
  if(d<0){if(at.ci>0)moveChord(D.idx,at.si,at.ci-1);else if(at.si>0)moveChord(D.idx,at.si-1,p.sections[at.si-1].chords.length);}
  else{if(at.ci<p.sections[at.si].chords.length-1)moveChord(D.idx,at.si,at.ci+2);else if(at.si<p.sections.length-1)moveChord(D.idx,at.si+1,0);}}
function delChord(fi){const p=curProg(),at=locate(fi);if(!at)return;progStop();
  p.sections[at.si].chords.splice(at.ci,1);state.view.sel=Math.max(0,Math.min(fi,flat(p).length-1));update();}
function act(a,el,ev){
  const p=curProg(),pv=state.pv,c=D.ch;
  if(a!=='delProg'&&delArmed){clearTimeout(delArmed);delArmed=null;}
  switch(a){
    case 'sel':if(ev&&ev.shiftKey){const fi=+el.dataset.i;if(fi===D.idx)break;if(state.view.cmp===fi){state.view.cmp=null;update();}else compareWith(fi);}else selectChord(+el.dataset.i);break;
    case 'cmpNext':compareWith(mod(D.idx+1,D.list.length));break;
    case 'cmpStop':state.view.cmp=null;update();break;
    case 'cmpSwap':if(D.pcmp){const a=D.idx;state.view.sel=D.cmpIdx;state.view.cmp=a;update();}break;
    case 'cmpKind':pv.cmpKind=el.dataset.v;update();break;
    case 'shStyle':state.set.sharedStyle=el.dataset.v;update();break;
    case 'focus':state.set.cmpFocus=el.dataset.v;update();break;
    case 'shLab':state.set.sharedLabel=el.dataset.v;update();break;
    case 'play':(progPlayer.on||progPlayer.loading)?progStop():progPlay();break;
    case 'loop':pv.loop=!pv.loop;update();break;
    case 'tr':{const p=curProg();if(p){transposeProg(p,+el.dataset.v);update();}}break;
    case 'band':bandOpen=!bandOpen;renderHead();break;
    case 'swing':pv.band.swing=+el.dataset.v;save();renderHead();break;
    case 'style':pv.band.style=el.dataset.v;save();renderHead();break;
    case 'intro':pv.band.intro=el.dataset.v;pv.band.count=el.dataset.v==='count';save();renderHead();break;
    case 'edit':editing=!editing;update();break;
    case 'del':delChord(+el.dataset.i);break;
    case 'remSec':p.sections.splice(+el.dataset.s,1);update();break;
    case 'addSec':p.sections.push({chords:[]});update();{const ins=document.querySelectorAll('.addc');if(ins.length)ins[ins.length-1].focus();}break;
    case 'barsUp':case 'barsDown':if(c){const i=BARS.indexOf(c.bars);c.bars=BARS[Math.max(0,Math.min(BARS.length-1,i+(a==='barsUp'?1:-1)))];update();}break;
    case 'scale':if(c){c.scale=el.dataset.id;update();}break;
    case 'info':openInfo();break;
    case 'fpick':{const fm=+el.dataset.f,mid=+el.dataset.mid,k=el.dataset.row;     /* vorm gekozen op de vormenkaart */
      if(!D.prog){const cur=state.pos.mf[k];state.pos.mf[k]=cur&&cur.f===fm&&Math.abs(cur.mid-mid)<.01?null:{f:fm,mid};}   /* Compare A/B: nog eens klikken = weg */
      else if(k==='B')fpinB={i:state.view.cmp,f:fm,mid};else if(c){c.fsel=fm;pv.fc=mid;}update();}break;
    case 'minfo':openMInfo();break;
    case 'soff':if(c){setSoff(c,+el.dataset.v);update();}break;
    case 'seq':if(c){c.soff=+el.dataset.o;c.scale=el.dataset.id;update();}break;          /* zelfde noten, andere grondtoon */
    case 'lab':pv.labels=el.dataset.v;update();break;
    case 'win':pv.win=el.dataset.v==='1';pv.forms=el.dataset.v==='2';update();break;
    case 'mv':moveBy(+el.dataset.v);break;
    case 'asText':openSheet('edit');break;
    case 'dup':{const cp=JSON.parse(JSON.stringify(p));cp.id=newId();cp.name=PT.copyOf(p.name);state.progs.splice(state.progs.indexOf(p)+1,0,cp);openProg(cp.id);break;}
    case 'delProg':
      if(!delArmed){delArmed=setTimeout(()=>{delArmed=null;if(D.prog)renderProgCard();},4000);renderProgCard();break;}
      clearTimeout(delArmed);delArmed=null;progStop();
      {const i=state.progs.indexOf(p);state.progs.splice(i,1);const nx=state.progs[Math.min(i,state.progs.length-1)];
       editing=false;if(nx){state.view.prog=nx.id;state.view.sel=0;}else{state.view.mode='compare';state.view.prog=null;}update();}
      break;
  }}

function addChords(si,text,input){
  const p=curProg(),toks=text.split(/\s+/).filter(Boolean),bad=[];let last=null;
  toks.forEach(t=>{const r=parseChord(t);if(r.bad){bad.push(t);return;}
    const k=sectionKeys(p.sections.map((x,i)=>i===si?x.chords.concat([r]):x.chords))[si];
    const ch={sym:r.sym,root:r.root,type:r.type,bars:r.bars,bass:r.bass||'',scale:suggestScales(r,k)[0]||'ionian'};p.sections[si].chords.push(ch);last=ch;});
  if(last)state.view.sel=flat(p).findIndex(x=>x.c===last);
  update();
  if(bad.length){const n=$('.addc[data-s="'+si+'"]');if(n){n.value=bad.join(' ');n.classList.add('bad');n.title=PT.badSym(bad[0]);n.focus();}}
  else{const n=$('.addc[data-s="'+si+'"]');if(n)n.focus();}}
