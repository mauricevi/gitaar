<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scale Trainer</title>
<link rel="icon" type="image/svg+xml" href="shared/favicon.svg">
<!-- SCALE TRAINER (Practice Room): twee toonladders (A en B) op één hals vergelijken, of een progressie met per akkoord een toonladder,
     posities (CAGED, 3 per snaar, Pat Martino-vormen …), backing track (gitaar, bas, drums).
     Schil (icoonbalk, achtergrond, kolom rechts, transportplank): shared/room.css + shared/rail.js; toets S = geheim menu (shared/look.js).
     Code in toonladder/ (gewone scripts, één gedeelde scope, volgorde telt). Opslag: 'toonladderTrainer:v1' (+ ':scalePref', ':log'). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=DotGothic16&family=Pixelify+Sans:wght@400..700&family=VT323&family=Space+Mono:wght@400;700&family=Handjet:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/room.css">
<link rel="stylesheet" href="toonladder/style.css">
</head>
<body>
<div class="bgfx photo"></div><div class="bgfx tex"></div><div class="bgfx grain"></div>
<div class="shell">
  <!-- icoonbalk: alleen apps (shared/rail.js tekent hem) -->
  <nav class="rail" id="side" data-app="scale-trainer"></nav>

  <main class="main">
    <div class="scroll" id="scroll">
     <div class="wrap">
      <!-- kop: Compare A / B en de progressies (voorheen in de zijbalk) -->
      <header class="top">
        <h1 class="px" data-t="nav.scales">Scale Trainer</h1>
        <nav class="seg glass plist" id="progList" aria-label="Progressions">
          <button type="button" id="navCmp" data-t="nav.compare">Compare A / B</button><span id="progBtns"></span><button type="button" id="btnNew" class="add" data-ta="nav.newProg">+</button>
        </nav>
        <span class="help dn l wide" tabindex="0" aria-label="How it works">?<i id="howTxt"></i></span>
      </header>

      <!-- Compare A / B: alleen grondtoon en toonladder; labels, kleuren en afspelen staan in de kolom rechts -->
      <div id="rows" aria-label="Scales"></div>

      <!-- progressie: de akkoorden; boven elke kaart de maatnummers (slepen = stuk herhalen); uitleg toetsen = ? op de transportplank -->
      <section class="paper panel" id="progCard" aria-label="Progression" hidden>
        <div class="ebar" id="editBar" hidden></div>
        <div id="secs"></div>
      </section>

      <section class="paper panel" id="cardBoard" aria-labelledby="hBoard">
        <h2 id="hBoard">Fretboard</h2>
        <!-- positie kiezen (Compare A / B) -->
        <div class="posbar" id="posBar">
          <div class="pf"><label for="sysSel" data-t="ui.system">Position system</label><select id="sysSel"></select></div>
          <div class="pf" id="refWrap"><label for="refSel" data-t="ui.basedOn">Positions based on</label>
            <select id="refSel"><option value="A" data-t="ui.scaleA">Scale A</option><option value="B" data-t="ui.scaleB">Scale B</option></select></div>
          <div class="pf"><label for="outSel" data-t="ui.outside">Notes outside the position</label>
            <select id="outSel"><option value="hide" data-t="ui.hide">Hide</option><option value="faint" data-t="ui.faint">Show faintly</option></select></div>
          <div class="pf" id="customBox"><span data-t="ui.range">Fret range</span>
            <span class="rng"><input type="number" id="cLo" min="0" max="22" data-ta="ui.from"> – <input type="number" id="cHi" min="0" max="22" data-ta="ui.to"></span></div>
          <span class="help dn l wide" id="hintCmp" tabindex="0" aria-label="How to use">?<i data-t="ui.hint"></i></span>
        </div>
        <div class="pchips" id="posChips" role="group" data-ta="ui.positions"></div>
        <!-- positie kiezen (progressie): hele hals · venster · Martino-vormen -->
        <div class="pvbar" id="pvBar" hidden></div>
        <div class="fmap" id="formMap" hidden></div>
        <div class="bwrap"><div id="board"></div></div>
        <div class="legend" id="legend"></div>
      </section>

      <section class="paper panel" id="cardCmp" aria-labelledby="hCmp" hidden>
        <h2 id="hCmp" data-t="ui.compareTitle">A compared with B</h2>
        <div class="sum" id="cmpSum"></div>
        <div class="stripw"><div class="strip" id="cmpStrip"></div></div>
        <div class="lists" id="cmpLists"></div>
      </section>
     </div>
    </div>

    <!-- transportplank: progressie = band (spelen, tellen, band, loop, tempo, transponeren, bewerken); Compare A / B = posities doorlopen -->
    <footer class="tray glass" id="tray">
      <div class="tr" id="progBar"></div>
      <div class="tr" id="cmpBar">
        <span class="krow"><button type="button" class="ib" id="tPrev"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button type="button" class="ib" id="tNext"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></span>
        <b class="tpos" id="tPos"></b>
      </div>
      <span class="stat" id="hSub"></span>
    </footer>
  </main>

  <!-- kolom rechts: instellen, niet spelen -->
  <aside class="col" id="col" aria-label="Side panel">
    <button type="button" class="ib reopen" data-col="open" title="Show side panel" aria-label="Show side panel"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="colhd">
      <span class="seg" id="colTabs" role="tablist" aria-label="Side panel"><button type="button" data-tab="main" id="tabMainB"></button><button type="button" data-tab="set" data-t="ui.settings">Settings</button></span>
      <button type="button" class="ib" data-col="shut" title="Hide side panel" aria-label="Hide side panel"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div id="tabMain">
      <!-- Compare A / B: labels, kleuren, afspelen, akkoorden van A → B -->
      <div id="colCmp">
        <h3 data-t="row.labels">Labels</h3>
        <div class="row"><span class="abl">A</span><select id="lblA" aria-label="Labels A"></select></div>
        <div class="row"><span class="abl">B</span><select id="lblB" aria-label="Labels B"></select></div>

        <h3 data-t="set.colours">Colours</h3>
        <div class="row"><label class="sw" id="swA"><input type="color" id="colA"><span>A</span></label><select id="cmA" aria-label="Colours A"></select></div>
        <div class="row"><label class="sw" id="swB"><input type="color" id="colB"><span>B</span></label><select id="cmB" aria-label="Colours B"></select></div>
        <div id="cmpColours"></div>

        <h3 data-t="set.sound">Sound</h3>
        <div class="row playrow"><button type="button" class="act" id="playA"></button><button type="button" class="act" id="playB"></button></div>
        <div id="cmpSound"></div>

        <section id="diat" aria-labelledby="chTitle">
          <h3 id="chTitle" data-t="ui.chordsTitle">Chords from A → B</h3>
          <span class="seg" role="group" data-ta="ui.chordSize">
            <button type="button" data-cs="3" data-t="ui.triad">Triad</button><button type="button" data-cs="7" data-t="ui.seventh">7th chord</button><button type="button" data-cs="9" data-t="ui.ninth">9th chord</button></span>
          <div class="dgrid" id="dchips" role="group" aria-labelledby="chTitle"></div>
          <details class="xmore" id="xMore">
            <summary><span data-t="ui.other">Other chord</span></summary>
            <p class="cap" data-t="ui.otherSub"></p>
            <div class="xpick">
              <label class="xf"><span data-t="ui.degree">Degree from A</span><select id="xDeg"></select></label>
              <label class="xf xq"><span data-t="ui.type">Type</span><select id="xQual"></select></label>
              <button type="button" class="act sm" id="xApply" data-t="ui.apply">Apply</button></div>
          </details>
        </section>
      </div>
      <!-- progressie: het gekozen akkoord (toonladder, tonen, bewerken) -->
      <div class="insp" id="insp" aria-label="Chord" hidden></div>
    </div>

    <div id="tabSet" hidden>
      <div id="setHost"></div>
      <h3 data-t="set.reset">Reset</h3>
      <div class="row"><button class="act sm" type="button" id="btnReset"></button><span id="resetMsg" role="status" class="cap"></span></div>
      <p class="note" data-t="ui.saved"></p>
      <h3>Backup</h3>
      <p class="note" style="margin-bottom:10px">All Practice Room apps.</p>
      <div id="prBackup" data-app="Scale Trainer" data-btn="act sm"></div>
    </div>
  </aside>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="shTitle">
  <header class="shh"><button type="button" class="lnk" id="shCancel" data-t="sheet.cancel">Cancel</button><b id="shTitle"></b><button type="button" class="lnk b" id="shSave" data-t="sheet.save">Save</button></header>
  <div class="shb">
    <div id="shTplWrap"><h3 data-t="sheet.start">Start from</h3><div class="tpls" id="shTpl"></div></div>
    <div id="shIr" hidden><h3 data-t="sheet.ir.title">Import from iReal Pro</h3>
      <div class="grp irbox"><textarea id="irIn" rows="2" spellcheck="false" autocomplete="off" data-ta="sheet.ir.paste"></textarea>
        <div class="irbar"><label class="act" for="irFile" data-t="sheet.ir.file">Open exported file…</label><input type="file" id="irFile" accept=".html,.htm,.txt" hidden>
          <input type="search" id="irQ" hidden data-ta="sheet.ir.search"><button type="button" class="act" id="irAll" hidden></button></div>
        <p class="cap" id="irMsg" role="status"></p><div class="irlist" id="irList"></div></div>
      <p class="cap" style="margin:8px 4px 0" data-t="sheet.ir.how"></p></div>
    <div><h3><label for="shName" data-t="sheet.name">Name</label></h3><div class="grp"><input type="text" id="shName" autocomplete="off"></div></div>
    <div><h3><label for="shChords" data-t="sheet.chords">Chords</label></h3>
      <div class="grp"><textarea id="shChords" rows="3" spellcheck="false" autocomplete="off"></textarea><div class="sherr" id="shErr" role="status"></div></div>
      <p class="cap" style="margin:8px 4px 0" data-t="sheet.help"></p></div>
    <div><h3 data-t="sheet.preview">Preview · suggested scales</h3><div class="prev" id="shPrev"></div><p class="cap" id="shKeys" style="margin:6px 4px 0"></p></div>
    <div><h3><label for="shTempo" data-t="sheet.tempo">Tempo</label></h3><div class="grp shtempo"><input type="number" id="shTempo" min="40" max="240" data-drag title="Drag up or down, or click to type"> BPM</div></div>
  </div>
</dialog>
<!-- uitleg: toonladders vanaf een andere noot (superimposities) -->
<dialog class="sheet" id="infoSheet" aria-labelledby="inTitle">
  <header class="shh"><span></span><b id="inTitle"></b><button type="button" class="lnk b" id="inClose">Done</button></header>
  <div class="shb" id="inBody"></div>
</dialog>

<!-- volgorde telt: alle scripts delen één scope -->
<script src="shared/look.js"></script>           <!-- geheim menu S (Look), vóór rail.js -->
<script src="shared/rail.js"></script>           <!-- icoonbalk, achtergrond, korrel -->
<script src="shared/guitar.js"></script>       <!-- zachte jazzgitaar (GTR): toonladder en comping -->
<script src="backing-sounds.js" defer></script>  <!-- opnames voor de backing track (mag ontbreken) -->
<script src="shared/backup.js"></script>         <!-- back-up (PRB), vóór de app -->
<script src="toonladder/text.js"></script>
<script src="toonladder/theory.js"></script>
<script src="toonladder/state.js"></script>
<script src="toonladder/render.js"></script>
<script src="toonladder/ui.js"></script>
<script src="toonladder/progressions.js"></script>
<script src="toonladder/backing.js"></script>
<script src="toonladder/import-dialog.js"></script>
<script src="toonladder/main.js"></script>
</body>
</html>
